                oneOf:
                - $ref: '#/components/schemas/agentic.channel.SendMessage.not-the-sender.Response'
                - additionalProperties: false
                  properties:
                    actor:
                      description: The qualified name of the actor the request was authenticated as, or null where it was authenticated as none.
                      type:
                      - string
                      - 'null'
                    refused:
                      description: The standard refusal for an actor no grant admits.
                      enum:
                      - not granted
                      type: string
                  required:
                  - refused
                  - actor
                  type: object
          description: 'Outcome `not-the-sender`: the caller is not one this branch admits: its guard compares the authenticated caller with the input or the record. The same request from an admitted caller is accepted. Or: the standard refusal for an actor no grant admits: the request was authenticated as no actor, or as one `x-ess-may-invoke` does not list. It is checked before the command runs, so nothing was read, written or published, and the same request from a granted actor is decided by the command. Its body carries `refused` and `actor`, never the `outcome` and `error` a declared branch carries.'
        '409':
          content:
            application/json:
              schema:
                discriminator:
                  mapping:
                    channel-closed: '#/components/schemas/agentic.channel.SendMessage.channel-closed.Response'
                    recipient-not-a-party: '#/components/schemas/agentic.channel.SendMessage.recipient-not-a-party.Response'
                    sender-not-a-party: '#/components/schemas/agentic.channel.SendMessage.sender-not-a-party.Response'
                    shared-channel: '#/components/schemas/agentic.channel.SendMessage.shared-channel.Response'
                    unknown-channel: '#/components/schemas/agentic.channel.SendMessage.unknown-channel.Response'
                  propertyName: outcome
                oneOf:
                - $ref: '#/components/schemas/agentic.channel.SendMessage.unknown-channel.Response'
                - $ref: '#/components/schemas/agentic.channel.SendMessage.shared-channel.Response'
                - $ref: '#/components/schemas/agentic.channel.SendMessage.sender-not-a-party.Response'
                - $ref: '#/components/schemas/agentic.channel.SendMessage.recipient-not-a-party.Response'
                - $ref: '#/components/schemas/agentic.channel.SendMessage.channel-closed.Response'
          description: 'Outcomes `unknown-channel`, `shared-channel`, `sender-not-a-party`, `recipient-not-a-party` and `channel-closed`: the input was acceptable and the subject is in a state this command does not act from. Resending the same request changes nothing until something else moves it.'
        '501':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  committed:
                    description: '`true` when the command''s effect and events were committed and delivering what it published failed; `false` when an unmet obligation stopped the command before anything was written.'
                    type: boolean
                  refused:
                    description: What was left unfinished, in words.
                    type: string
                required:
                - refused
                - committed
                type: object
          description: 'No declared outcome: the realization is unfinished. Either a port this command runs reported an unmet obligation, and nothing was written: `committed` is `false`. Or the command''s effect was committed and delivering what this command published to a binding failed: `committed` is `true`, the effect and its events stand, and each binding whose delivery failed keeps its event and is attempted again on a later delivery, while no other binding receives it twice. Do not retry: after a failed delivery a retry performs the command a second time.'
