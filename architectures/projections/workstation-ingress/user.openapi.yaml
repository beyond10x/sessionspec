paths:
  /agent/views/agent-revisions:
    get:
      operationId: agentic.agent.AgentRevisions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agentic.agent.AgentRevisions.Response'
          description: 'Every row of `agentic.agent.AgentRevisions`, a projection of `agentic.agent.AgentRevision`. Contains every instance. Read-your-writes: a caller that has just issued a command sees its effect here.'
        '403':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  actor:
                    description: The qualified name of the actor the request was authenticated as, or null where it was authenticated as none.
                    type:
                    - string
                    - 'null'
                  refused:
                    description: The standard refusal for an actor no grant admits.
                    enum:
                    - not granted
                    type: string
                required:
                - refused
                - actor
                type: object
          description: 'No declared outcome: the standard refusal for an actor no grant admits: the request was authenticated as no actor, or as one `x-ess-may-read` does not list. It is checked before the view is read, so no row was read, and the same request from a granted actor answers the rows. Its body is the one a command answers an ungranted actor.'
