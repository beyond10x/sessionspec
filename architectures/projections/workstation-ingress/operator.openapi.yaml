tags:
- description: 'The definition of an agent. An agent is a principal of kind Agent with a name. Its behaviour is fixed by an immutable revision: a role, instructions held as content, a model or route for each use, the tools it may call, the knowledge it is given and its budget limits. A change is a new revision, never an edit. A revision is published, may be retired, and a retired revision is refused wherever it would be used.'
  name: agent
- description: 'How parties exchange messages. A direct channel joins exactly two parties, each a principal or a harness session, and carries messages from one to the other. A shared channel (a topic, a queue or a board) has the parties that subscribe to it, and carries posts. A channel says how it delivers: in order or not, and whether it may lose a message. Only a party sends, only while the channel is open, and every message and post says whether it requests an action or informs, how its sender is proven, and the delegation it is sent under when it is sent for another party. A subscription may relay a principal''s posts into a session and carries a heartbeat. The message sequences over a channel are protocols of their own; this block is the contract they run on.'
  name: channel
- description: 'The one place model calls pass. A gateway holds upstreams, each an endpoint of `agentic.model` behind it. Every call by a caller principal on a route is decided once and recorded under its InferenceId: admitted, over-budget, rate-limited or no-upstream. An admitted call is completed with its usage and outcome; a refused call stays on record and cannot complete. A gateway that drains admits no new call.'
  name: gateway
- description: 'The loop that turns a model into an agent: it sends the context to a model, takes the answer, runs tools, compacts the context when it grows, and stops. A harness is of one kind: a vendor''s loop run as it ships, a loop driven from outside, or a loop native to this system. A harness session is one agent revision running in a harness for a principal. A sub-agent is a session whose parent is another session, so sessions form a tree with a depth that the harness bounds. Every model call of a session is a turn, with the inference it made and its usage. Every call of a tool by a session is a tool call: requested, decided (allowed or denied, with who decided), and then completed, failed, or recorded as could not read when its result could not be read; a call of a withdrawn tool is refused, and a call that was not allowed cannot complete. A session opens in a permission mode a field of work or a binding registered; the core names no mode. A session that restarts an ended one names it, and the chain of restarts is its lineage.'
  name: harness
- description: What a model is and how it is reached. A provider offers models; a model has capabilities, a context window and a price per token class; an endpoint is where one model is served; a route is a name that resolves to one endpoint and model. An inference is one request on a route with its usage, latency and outcome. A retired route accepts no new inference.
  name: model
- description: 'Who can want something and answer for it. A principal is a human, an organization, a service or an agent. Everything that is asked, approved, delegated or paid for traces back to one. A principal has a name and a kind. How it is reached is the channel block''s concern: a channel names its parties, a principal names no channel, so the dependency points down.'
  name: principal
- description: A message that needs an answer. A question offers lettered options, names the option it takes by default and a deadline; past the deadline the default is taken. Only the addressee, or a delegate acting for it, answers. A reply that could not be read is recorded as could not read, and the default is not taken in its place. An approval is a question whose two options are approve and reject.
  name: question
- description: 'What agents share and wait for: a pool of a fixed capacity (build slots, a rate limit, a cache, seats, a work queue) and the claims on it. A claim waits in the queue until the pool grants it, holds for at most its time limit, and ends released, expired or killed; its holder may withdraw it while it is queued. A claim over capacity waits; it is never refused for that. The queue publishes when each claim joined it (queued_at), the order the pool grants in.'
  name: resource
- description: 'What a workload can reach: an isolation level, the paths it may write, the hosts and ports it may connect to, and the secrets it may read, by name only. Default deny: a reach no rule names is refused. A secret''s value is never part of the contract.'
  name: sandbox
- description: 'The files an agent works on: a checkout, a scratch copy or a worktree, at a base revision. A lease names who works in it; it is requested, then granted, and an exclusive workspace has at most one live lease. Only the holder of a live lease writes, and a change leaves the workspace only as a proposal, which is merged, rejected or superseded. A proposal hands its change back as an artifact of a store (`agentic.store`).'
  name: workspace
