format: agenticspec-contract/1
architecture: auto-merger
ports_digest: cb3e90e933bd20046426247f4a060751e6f8774bd043c5eaf1c24ac82ba6a0e9
ports:
  - port: gateway.call
    part: gateway
    protocol: "AdmitCall CompleteCall"
    instances: 1
    settings: {rate_limit_per_minute: 30}
  - port: authority.decision
    part: merge_grant
    protocol: "(DecideRequest | DenyRequest) (ApproveDecision | RejectDecision)"
    instances: 1
    settings: {kind: grant}
  - port: harness.session
    part: merger
    protocol: "(OpenSession | SpawnSubAgent) (CompactContext | RecordRestart | RecordTurn)* EndSession"
    instances: 1
    settings: {acts_for: owner, harness: coding, role: merger}
  - port: model.inference
    part: merger
    protocol: "StartInference FinishInference"
    instances: 1
    settings: {}
  - port: question.question
    part: merger
    protocol: "Ask (Answer | RecordUnreadableAnswer | TakeDefault | Withdraw)"
    instances: 1
    settings: {}
  - port: model.inference
    part: model
    protocol: "StartInference FinishInference"
    instances: 1
    settings: {route: small}
  - port: trigger.firing
    part: on_checks
    protocol: "FireTrigger (RecordFailure | RecordStart (RecordEnd | RecordReplaced) | SkipFiring)"
    instances: 1
    settings: {event_name: agentic.scm.change.ChecksRecorded, kind: on_event, max_parallel: 1, policy: queue}
  - port: question.question
    part: owner
    protocol: "Ask (Answer | RecordUnreadableAnswer | TakeDefault | Withdraw)"
    instances: 1
    settings: {kind: human}
invariants:
  - link: "on_checks -> merger carries trigger"
    port: trigger.firing
    predicate: "every trigger.firing@on_checks to merger"
  - link: "merge_grant -> merger carries grant"
    port: authority.decision
    predicate: "every authority.decision@merge_grant to merger"
  - link: "merger -> owner carries question"
    port: question.question
    predicate: "every question.question@merger to owner"
  - link: "merger -> gateway carries model_call"
    port: model.inference
    within: gateway.call
    predicate: "every model.inference@merger inside gateway.call@gateway"
  - link: "gateway -> model carries model_call"
    port: gateway.call
    predicate: "every gateway.call@gateway to model"
border: [merger]
ingress:
  - name: metrics
    audience: control.monitor
    authenticated: false
    exports: [metrics_scrape]
    operations:
      - {kind: metric, name: cache_bust_count}
      - {kind: metric, name: cache_hit_share}
      - {kind: metric, name: context_size_p90_tokens}
      - {kind: metric, name: cost_usd}
      - {kind: metric, name: decider_recorded_share}
      - {kind: metric, name: human_decided_share}
      - {kind: metric, name: human_prompt_share}
      - {kind: metric, name: owner_wait_share}
      - {kind: metric, name: priced_message_share}
      - {kind: metric, name: sub_agents_started}
      - {kind: metric, name: subagent_cost_share}
  - name: operator
    audience: control.operator
    authenticated: true
    exports: [http, event_stream, ui, tool]
    operations:
      - {kind: command, name: agentic.authority.RevokeGrant}
      - {kind: command, name: agentic.gateway.DetachUpstream}
