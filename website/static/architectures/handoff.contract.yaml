format: agenticspec-contract/1
architecture: handoff
ports_digest: 7afd895ae08fab3e4cbdc67c51a37318624217025039ec8153c704923213feba
ports:
  - port: harness.session
    part: a
    protocol: "(OpenSession | SpawnSubAgent) (CompactContext | RecordRestart | RecordTurn)* EndSession"
    instances: 1
    settings: {harness: coding}
  - port: model.inference
    part: a
    protocol: "StartInference FinishInference"
    instances: 1
    settings: {}
  - port: question.question
    part: a
    protocol: "Ask (Answer | RecordUnreadableAnswer | TakeDefault | Withdraw)"
    instances: 1
    settings: {}
  - port: harness.session
    part: b
    protocol: "(OpenSession | SpawnSubAgent) (CompactContext | RecordRestart | RecordTurn)* EndSession"
    instances: 1
    settings: {harness: coding}
  - port: model.inference
    part: b
    protocol: "StartInference FinishInference"
    instances: 1
    settings: {}
  - port: question.question
    part: b
    protocol: "Ask (Answer | RecordUnreadableAnswer | TakeDefault | Withdraw)"
    instances: 1
    settings: {}
  - port: model.inference
    part: model
    protocol: "StartInference FinishInference"
    instances: 1
    settings: {route: frontier}
  - port: question.question
    part: owner
    protocol: "Ask (Answer | RecordUnreadableAnswer | TakeDefault | Withdraw)"
    instances: 1
    settings: {kind: human}
invariants:
  - link: "a -> owner carries question"
    port: question.question
    predicate: "every question.question@a to owner"
  - link: "b -> owner carries question"
    port: question.question
    predicate: "every question.question@b to owner"
  - link: "a -> model carries model_call"
    port: model.inference
    predicate: "every model.inference@a to model"
  - link: "b -> model carries model_call"
    port: model.inference
    predicate: "every model.inference@b to model"
border: []
ingress:
  - name: metrics
    audience: control.monitor
    authenticated: false
    exports: [metrics_scrape]
    operations:
      - {kind: metric, name: cache_bust_count}
      - {kind: metric, name: cache_hit_share}
      - {kind: metric, name: context_size_p90_tokens}
      - {kind: metric, name: cost_usd}
      - {kind: metric, name: human_prompt_share}
      - {kind: metric, name: owner_wait_share}
      - {kind: metric, name: priced_message_share}
      - {kind: metric, name: sub_agents_started}
      - {kind: metric, name: subagent_cost_share}
  - name: operator
    audience: control.operator
    authenticated: true
    exports: [http, event_stream, ui, tool]
    operations:
      - {kind: command, name: agentic.question.Answer}
      - {kind: view, name: agentic.agent.AgentRevisions}
      - {kind: view, name: agentic.agent.Agents}
      - {kind: view, name: agentic.agent.RevisionUsages}
      - {kind: view, name: agentic.harness.HarnessSessions}
      - {kind: view, name: agentic.harness.Harnesses}
      - {kind: view, name: agentic.harness.PermissionModes}
      - {kind: view, name: agentic.harness.ToolCalls}
      - {kind: view, name: agentic.harness.Turns}
      - {kind: view, name: agentic.model.Endpoints}
      - {kind: view, name: agentic.model.Inferences}
      - {kind: view, name: agentic.model.Models}
      - {kind: view, name: agentic.model.Routes}
      - {kind: view, name: agentic.principal.Principals}
      - {kind: view, name: agentic.question.OpenQuestions}
      - {kind: view, name: agentic.question.Questions}
