format: agenticspec-contract/1
architecture: team-with-console
ports_digest: cb3e90e933bd20046426247f4a060751e6f8774bd043c5eaf1c24ac82ba6a0e9
ports:
  - port: gateway.call
    part: console.gateway
    protocol: "AdmitCall CompleteCall"
    instances: 1
    settings: {rate_limit_per_minute: 60}
  - port: harness.session
    part: console.helper
    protocol: "(OpenSession | SpawnSubAgent) (CompactContext | RecordRestart | RecordTurn)* EndSession"
    instances: 1
    settings: {harness: coding}
  - port: model.inference
    part: console.helper
    protocol: "StartInference FinishInference"
    instances: 1
    settings: {}
  - port: question.question
    part: console.helper
    protocol: "Ask (Answer | RecordUnreadableAnswer | TakeDefault | Withdraw)"
    instances: 1
    settings: {}
  - port: model.inference
    part: console.model
    protocol: "StartInference FinishInference"
    instances: 1
    settings: {route: frontier}
  - port: harness.session
    part: console.steward
    protocol: "(OpenSession | SpawnSubAgent) (CompactContext | RecordRestart | RecordTurn)* EndSession"
    instances: 1
    settings: {harness: coding, role: orchestrator}
  - port: model.inference
    part: console.steward
    protocol: "StartInference FinishInference"
    instances: 1
    settings: {}
  - port: question.question
    part: console.steward
    protocol: "Ask (Answer | RecordUnreadableAnswer | TakeDefault | Withdraw)"
    instances: 1
    settings: {}
  - port: gateway.call
    part: gateway
    protocol: "AdmitCall CompleteCall"
    instances: 1
    settings: {rate_limit_per_minute: 60}
  - port: model.inference
    part: model
    protocol: "StartInference FinishInference"
    instances: 1
    settings: {route: frontier}
  - port: question.question
    part: owner
    protocol: "Ask (Answer | RecordUnreadableAnswer | TakeDefault | Withdraw)"
    instances: 1
    settings: {kind: human}
  - port: harness.session
    part: worker
    protocol: "(OpenSession | SpawnSubAgent) (CompactContext | RecordRestart | RecordTurn)* EndSession"
    instances: 3
    settings: {harness: coding}
  - port: model.inference
    part: worker
    protocol: "StartInference FinishInference"
    instances: 3
    settings: {}
  - port: question.question
    part: worker
    protocol: "Ask (Answer | RecordUnreadableAnswer | TakeDefault | Withdraw)"
    instances: 3
    settings: {}
invariants:
  - link: "console.steward -> owner carries question"
    port: question.question
    predicate: "every question.question@console.steward to owner"
  - link: "worker -> console.steward carries question"
    port: question.question
    predicate: "every question.question@worker to console.steward"
  - link: "worker -> gateway carries model_call"
    port: model.inference
    within: gateway.call
    predicate: "every model.inference@worker inside gateway.call@gateway"
  - link: "gateway -> model carries model_call"
    port: gateway.call
    predicate: "every gateway.call@gateway to model"
  - link: "console.helper -> console.steward carries question"
    port: question.question
    predicate: "every question.question@console.helper to console.steward"
  - link: "console.steward -> console.gateway carries model_call"
    port: model.inference
    within: gateway.call
    predicate: "every model.inference@console.steward inside gateway.call@console.gateway"
  - link: "console.helper -> console.gateway carries model_call"
    port: model.inference
    within: gateway.call
    predicate: "every model.inference@console.helper inside gateway.call@console.gateway"
  - link: "console.gateway -> console.model carries model_call"
    port: gateway.call
    predicate: "every gateway.call@console.gateway to console.model"
border: [console.steward]
ingress:
  - name: metrics
    audience: control.monitor
    authenticated: false
    exports: [metrics_scrape]
    operations:
      - {kind: metric, name: cache_bust_count}
      - {kind: metric, name: cache_hit_share}
      - {kind: metric, name: context_size_p90_tokens}
      - {kind: metric, name: cost_usd}
      - {kind: metric, name: human_prompt_share}
      - {kind: metric, name: owner_wait_share}
      - {kind: metric, name: priced_message_share}
      - {kind: metric, name: sub_agents_started}
      - {kind: metric, name: subagent_cost_share}
  - name: operator
    audience: control.operator
    authenticated: true
    exports: [http, event_stream, ui, tool]
    operations:
      - {kind: command, name: agentic.gateway.DetachUpstream}
      - {kind: command, name: agentic.gateway.DrainGateway}
      - {kind: command, name: agentic.gateway.StopGateway}
      - {kind: command, name: agentic.question.Answer}
      - {kind: view, name: agentic.agent.AgentRevisions}
