# Only an apply runs dry: `dry-run-outside-apply` refuses a call when it is a dry run and its tool
# is not Apply, both at once. Synthesis witnesses the refusal and one accepted call, which leaves
# the `and` of the guard unpinned (a mutation audit turning it into `or` survived). This scenario
# sends the two calls that tell the two apart: a query that is no dry run, and an apply that is.
type: ess-scenario/7
domain: studio.session
scenario: call-tool-dry-run-only-for-apply
summary: A query that is no dry run is called, an apply that is a dry run is called, a check that is a dry run is refused.

arrange:
  - instance: draft
    entity: studio.draft.Draft
  - instance: session
    entity: studio.session.Session

timeline:
  - at: 2026-11-28T10:00:00Z
    command: studio.draft.OpenDraft
    actor: studio.session.User
    input:
      name: workstation
      architecture: 00000000-0000-4000-8000-0000000000a1
    outcome: opened
    capture: {instance: draft, event: studio.draft.DraftOpened, field: draft_id}

  - at: 2026-11-28T10:00:01Z
    command: studio.session.StartSession
    actor: studio.session.User
    input: {draft_id: {$instance: draft}}
    outcome: started
    capture: {instance: session, event: studio.session.SessionStarted, field: session_id}

  - at: 2026-11-28T10:00:02Z
    command: studio.session.CallTool
    actor: studio.session.Agent
    input:
      session_id: {$instance: session}
      tool: Query
      arguments: '{"selector": "part{id: P}"}'
      dry_run: false
    caller: {kind: Agent}
    outcome: called
    events:
      - event: studio.session.ToolCalled
        payload: {session_id: {$instance: session}, tool: Query, caller: Agent, dry_run: false}

  - at: 2026-11-28T10:00:03Z
    command: studio.session.CallTool
    actor: studio.session.User
    input:
      session_id: {$instance: session}
      tool: Apply
      arguments: '{"patch": "set part{id: worker}.model = \"m\""}'
      dry_run: true
    caller: {kind: User}
    outcome: called
    events:
      - event: studio.session.ToolCalled
        payload: {session_id: {$instance: session}, tool: Apply, caller: User, dry_run: true}

  - at: 2026-11-28T10:00:04Z
    command: studio.session.CallTool
    actor: studio.session.User
    input:
      session_id: {$instance: session}
      tool: Check
      arguments: '{}'
      dry_run: true
    caller: {kind: User}
    outcome: dry-run-outside-apply
    error:
      name: studio.session.DryRunOutsideApply
    no_events: [studio.session.ToolCalled]
