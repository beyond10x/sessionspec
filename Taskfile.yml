version: '3'

tasks:
  check:
    desc: Run the repository gate.
    cmds:
      - task: check:spec
      - task: check:blocks
      - task: check:mutation
      - task: check:fields
      - task: check:ports
      - task: check:bundles
      - task: check:projections
      - task: check:ui
      - task: check:app
      - task: check:ui-kit
      - task: check:studio
      - task: check:views
      - task: check:examples
      - task: check:elements
      - task: check:operator
      - task: check:generated
      - task: check:docs
      - task: check:ladder
      - task: check:scenarios
      - task: check:site
      - task: check:scripts
      - task: check:rust
      - task: test

  check:blocks:
    desc: Validate the building blocks (blocks/) and the agenticstudio system (studio/), hold their layering, keep the words of every field out of the core (check:neutral), and run their conformance suite, authored scenarios included, on the interpreter. The suite is synthesized once per digest of its sources into target/blocks-conform/ (scripts/check-blocks-conform.sh).
    cmds:
      - ess specify validate --path blocks --strict-requires
      - ess specify validate --path studio --strict-requires
      - task: check:layers
      - task: check:kpis
      - task: check:neutral
      - scripts/check-blocks-conform.sh

  slow:blocks:
    desc: Slow lane. Synthesize the conformance suite of blocks/ afresh, compare it byte for byte with the cached suite of the same digest, and run it.
    cmds:
      - scripts/check-blocks-conform.sh --slow

  check:fields:
    desc: Validate the whole system (the core and the packs, from the root ess-inputs.yaml), hold the pack and field manifests against it and keep product names out of packs/ and fields/ (scripts/check-packs.sh), run its conformance suite with the packs' authored scenarios on the interpreter (synthesized once per digest into target/system-conform/, scripts/check-blocks-conform.sh --path .), and check every architecture a field lists with agenticspec sim check.
    cmds:
      - ess specify validate --path . --strict-requires
      - scripts/check-packs.sh
      - scripts/check-blocks-conform.sh --path .
      - cargo build --quiet --locked -p agenticspec
      - |
        set -eu
        for manifest in fields/*/field.yaml; do
          dir=${manifest%/field.yaml}
          for a in $(yq '.architectures // [] | .[]' "$manifest"); do
            printf 'check:fields: %s/%s ' "$dir" "$a"
            target/debug/agenticspec sim check "$dir/$a"
          done
        done

  slow:fields:
    desc: Slow lane. Synthesize the conformance suite of the whole system afresh, compare it byte for byte with the cached suite of the same digest, and run it.
    cmds:
      - scripts/check-blocks-conform.sh --path . --slow

  ports:generate:
    desc: Derive the ports of the building blocks (bindings and lifecycles of blocks/, compiled by ess) into the committed blocks/ports.json, with the digest of its sources.
    cmds:
      - cargo build --quiet --locked -p agenticspec
      - target/debug/agenticspec sim ports --blocks blocks --out blocks/ports.json

  check:ports:
    desc: Fail when blocks/ports.json was derived from other sources than blocks/ (its digest only, no ess call); names task ports:generate.
    cmds:
      - cargo build --quiet --locked -p agenticspec
      - target/debug/agenticspec sim ports --blocks blocks --check blocks/ports.json

  slow:ports:
    desc: Slow lane. Derive the ports afresh and compare them byte for byte with blocks/ports.json.
    cmds:
      - cargo build --quiet --locked -p agenticspec
      - mkdir -p target/ports
      - target/debug/agenticspec sim ports --blocks blocks --out target/ports/ports.json
      - cmp blocks/ports.json target/ports/ports.json

  contract:conform:
    desc: Cut the conformance suite of the building blocks to one architecture's contract and run it on the interpreter (task contract:conform -- <architecture.yaml>). The suite is the cached one of scripts/check-blocks-conform.sh; the lines are in scripts/contract-conform.sh.
    cmds:
      - cargo build --quiet --locked -p agenticspec
      - scripts/contract-conform.sh {{.CLI_ARGS}}

  bundles:generate:
    desc: Write the fixture bundles, bundles/<architecture>.<binding>.yaml (agenticspec deploy bundle of each catalog architecture under each binding of bundles/bindings/), and the digest of their sources, bundles/sources.sha256.
    cmds:
      - cargo build --quiet --locked -p agenticspec-docs
      - target/debug/agenticspec-docs --root . --bundles

  check:bundles:
    desc: Fail when a fixture bundle was written from other sources than the current ones (bundles/sources.sha256, digests only; builds no bundle); names task bundles:generate.
    cmds:
      - cargo build --quiet --locked -p agenticspec-docs
      - target/debug/agenticspec-docs --root . --bundles --check

  slow:bundles:
    desc: Slow lane. Build every fixture bundle afresh and compare it byte for byte with the committed one.
    cmds:
      - cargo build --quiet --locked -p agenticspec-docs
      - target/debug/agenticspec-docs --root . --bundles --slow

  projections:generate:
    desc: Write the projections of the exports of the worked example architectures/workstation-ingress.yaml (per http export its ess-http/1 protocol binding and OpenAPI document, per event_stream its stream list, per tool its tool list, per metrics_scrape its metric list) into architectures/projections/workstation-ingress/.
    cmds:
      - cargo build --quiet --locked -p agenticspec
      - target/debug/agenticspec ingress project architectures/workstation-ingress.yaml --out architectures/projections/workstation-ingress

  check:projections:
    desc: Fail when a committed projection of the worked example differs from a fresh one (ess compiles the blocks and writes their OpenAPI document, about a second), naming the command that writes them again.
    cmds:
      - cargo build --quiet --locked -p agenticspec
      - target/debug/agenticspec ingress project architectures/workstation-ingress.yaml --check architectures/projections/workstation-ingress

  check:kpis:
    desc: Check kpis/catalogue.yaml, every packs/<pack>/kpis.yaml and every fields/<field>/kpis.yaml against their format, their blocks and the events they may read.
    cmds:
      - scripts/check-kpis.sh

  check:neutral:
    desc: Fail when a word a field lists in fields/<field>/words.txt appears in the core, blocks/ or kpis/catalogue.yaml; then each fixture under scripts/fixtures/neutral must fail.
    cmds:
      - scripts/check-neutral.sh
      - scripts/check-neutral.sh --negative

  check:layers:
    desc: Fail when a block depends on a block of a higher layer, two blocks of one layer depend on each other, a core block depends on a pack or field, a pack on a field or an undeclared pack, or a field on another field; for blocks/ and for the whole system. Then each fixture under scripts/fixtures/layers must fail and each under scripts/fixtures/layers-pass must pass.
    cmds:
      - scripts/check-layers.sh
      - scripts/check-layers.sh --path .
      - scripts/check-layers.sh --negative
      - scripts/check-layers.sh --positive

  layers:graph:
    desc: Print the dependency graph between blocks with counts, then the layer check.
    cmds:
      - scripts/check-layers.sh --graph

  docs:generate:
    desc: Write the generated pages of the docs site (docs/blocks/, docs/architectures/, docs/kpis-catalogue.md, website/static/architectures/, website/src/generated/) from blocks/, kpis/catalogue.yaml, architectures/ and experiments/.
    cmds:
      - cargo build --quiet --locked -p agenticspec-docs
      - target/debug/agenticspec-docs --root .

  catalog:generate:
    desc: Run every experiment under experiments/ at its own budget and seeds and write the committed result of its catalog entry, website/static/catalog/<entry>/result.json, with the digest of its sources beside it (sources.sha256). Run task docs:generate after it.
    cmds:
      - cargo build --quiet --locked -p agenticspec-docs
      - target/debug/agenticspec-docs --root . --results

  slow:catalog:
    desc: Slow lane. Run every experiment of the catalog afresh and compare its result and digest file byte for byte with the committed ones.
    cmds:
      - cargo build --quiet --locked -p agenticspec-docs
      - target/debug/agenticspec-docs --root . --results --check

  check:docs:
    desc: Fail when a generated page of the docs site differs from a fresh generation, is missing or is not generated; names the files.
    cmds:
      - cargo build --quiet --locked -p agenticspec-docs
      - target/debug/agenticspec-docs --root . --check

  ladder:generate:
    desc: Check the agentic ladder (ladder/ladder.yaml and its rungs in architectures/ladder/) and write the data file of its page, website/static/ladder/ladder.json.
    cmds:
      - cargo build --quiet --locked -p agenticspec
      - target/debug/agenticspec sim ladder ladder/ladder.yaml --out website/static/ladder/ladder.json

  check:ladder:
    desc: Fail when the agentic ladder is refused or website/static/ladder/ladder.json differs from a fresh generation.
    cmds:
      - cargo build --quiet --locked -p agenticspec
      - target/debug/agenticspec sim ladder ladder/ladder.yaml --out website/static/ladder/ladder.json --check

  check:scenarios:
    desc: Run every scenario under scenarios/ (scenarios/*/*.scenario.yaml) on the simulator, which checks it against its architecture first and fails on an expectation that fails, then every corpus there (scenarios/*/*.corpus.yaml), which fails on an entry that predicts another class than it expects.
    cmds:
      - cargo build --quiet --locked -p agenticspec
      - |
        set -eu
        n=0
        for s in scenarios/*/*.scenario.yaml; do
          [ -f "$s" ] || { echo "check:scenarios: no scenarios/*/*.scenario.yaml"; exit 1; }
          target/debug/agenticspec sim scenario run "$s" --out "target/scenarios/$(basename "$s" .scenario.yaml)" > /dev/null
          n=$((n + 1))
        done
        c=0
        for f in scenarios/*/*.corpus.yaml; do
          [ -f "$f" ] || continue
          target/debug/agenticspec sim corpus run "$f" > /dev/null
          c=$((c + 1))
        done
        echo "check:scenarios: $n scenario(s) and $c corpus file(s) held"

  check:scripts:
    desc: Run every script test, scripts/*.test.sh.
    cmds:
      - |
        set -eu
        n=0
        for t in scripts/*.test.sh; do
          [ -f "$t" ] || { echo "check:scripts: no scripts/*.test.sh"; exit 1; }
          echo "check:scripts: sh $t"
          sh "$t"
          n=$((n + 1))
        done
        echo "check:scripts: $n script test(s) passed"

  site:
    desc: Build the documentation site (website/, pages read in place from docs/) into website/build, as the job build of .github/workflows/pages.yml does.
    dir: website
    cmds:
      - npm ci
      - npm run build

  check:spec:
    desc: Validate the specification, synthesize its conformance suite with no refusal and run it on the interpreter.
    cmds:
      - ess specify validate --path spec
      - mkdir -p target/spec && ess verify conform synthesize --path spec --out target/spec/suite.json
      - ess verify conform run --target interpreted --path spec --suite target/spec/suite.json --report-format 2 --report-out target/spec/report.json > target/spec/run.txt 2>&1 || { grep -E '^  (failed|error|unsupported) ' target/spec/run.txt; tail -n 1 target/spec/run.txt; exit 1; }
      - tail -n 1 target/spec/run.txt

  spec:diff:
    desc: Classify the change of blocks/, spec/ and studio/ since a git revision (task spec:diff -- <revision>; the newest release tag without one) as breaking, unknown or compatible for callers, readers and history; exits 4 on a breaking or unknown change. Not in the gate. The lines are in scripts/spec-diff.sh.
    cmds:
      - sh scripts/spec-diff.sh {{.CLI_ARGS}}

  check:mutation:
    desc: Mutation audit of spec/ and studio/ on the interpreter, authored scenarios included; fails on a mutant the suite does not kill that the specification's mutation-known.txt does not list, and on a listed one that is now killed (about 35 s; the lines are in scripts/check-mutation.sh).
    cmds:
      - sh scripts/check-mutation.sh spec
      - sh scripts/check-mutation.sh studio

  check:ui:
    desc: Check the ess-ui document against the specification and run its headless tests on the fixtures; then fail when the block panels (ui/views/) differ from a fresh generation from blocks/ or their digest no longer matches (ui/views/serve.fixtures.json included), and check them against blocks/ with no finding.
    cmds:
      - ess ui check --path ui/agenticspec.ui.yaml --model spec
      - ess ui test --path ui/agenticspec.ui.yaml ui/tests/session.yaml
      - cargo build --quiet --locked -p agenticspec
      - target/debug/agenticspec ui panels --check
      - |
        out=$(ess ui check --path ui/views/blocks.ui.yaml --model blocks) || { echo "$out"; exit 1; }
        echo "$out"
        echo "$out" | grep -q ': 0 error(s), 0 warning(s)$' || { echo "check:ui: ui/views/blocks.ui.yaml has a warning"; exit 1; }
      - target/debug/agenticspec sim contract architectures/workstation.yaml --check ui/views/examples/workstation.contract.yaml
      - |
        cmp blocks/ports.json ui/views/examples/ports.json || { echo "check:ui: ui/views/examples/ports.json differs from blocks/ports.json; run task ui:derive"; exit 1; }
      - target/debug/agenticspec ui derive --check --path architectures/workstation.yaml --contract ui/views/examples/workstation.contract.yaml --ports ui/views/examples/ports.json --out ui/views/examples/workstation.ui.yaml
      - target/debug/agenticspec ui derive --check --path crates/agenticspec-render/tests/fixtures/large-37.yaml --out ui/views/examples/large-37.ui.yaml
      - target/debug/agenticspec sim contract architectures/team-with-console.yaml --check ui/views/examples/team-with-console.contract.yaml
      - target/debug/agenticspec ui derive --check --control-plane --path architectures/workstation.yaml --contract ui/views/examples/workstation.contract.yaml --ports ui/views/examples/ports.json --out ui/views/examples/workstation.control-plane.ui.yaml
      - target/debug/agenticspec ui derive --check --control-plane --path architectures/team-with-console.yaml --contract ui/views/examples/team-with-console.contract.yaml --ports ui/views/examples/ports.json --out ui/views/examples/team-with-console.control-plane.ui.yaml
      - target/debug/agenticspec sim contract architectures/workstation-ingress.yaml --check ui/views/examples/workstation-ingress.contract.yaml
      - target/debug/agenticspec ui derive --check --path architectures/workstation-ingress.yaml --contract ui/views/examples/workstation-ingress.contract.yaml --ports ui/views/examples/ports.json --out ui/views/examples/workstation-ingress.ui.yaml
      - |
        for f in ui/views/examples/workstation.ui.yaml ui/views/examples/large-37.ui.yaml ui/views/examples/host-slot.ui.yaml ui/views/examples/workstation.control-plane.ui.yaml ui/views/examples/team-with-console.control-plane.ui.yaml ui/views/examples/workstation-ingress.user.ui.yaml ui/views/examples/workstation-ingress.operator.ui.yaml; do
          out=$(ess ui check --path "$f" --model blocks) || { echo "$out"; exit 1; }
          echo "$out" | tail -n 1
          echo "$out" | grep -q ': 0 error(s), 0 warning(s)$' || { echo "check:ui: $f has a warning"; exit 1; }
        done

  ui:derive:
    desc: Write the derived examples of ui/views/examples/ with agenticspec ui derive - workstation.ui.yaml from architectures/workstation.yaml, its contract (written first by agenticspec sim contract) and a copy of blocks/ports.json beside it, and large-37.ui.yaml from the 37-part fixture alone, and the control-plane UIs workstation.control-plane.ui.yaml and team-with-console.control-plane.ui.yaml (ui derive --control-plane, team-with-console.contract.yaml written first), and one UI per ingress with a ui export of architectures/workstation-ingress.yaml, workstation-ingress.user.ui.yaml and workstation-ingress.operator.ui.yaml (its contract written first) - each with its fixtures, its layout and the digest of its inputs. Never edited by hand; task check:ui holds them.
    cmds:
      - cargo build --quiet --locked -p agenticspec
      - target/debug/agenticspec sim contract architectures/workstation.yaml --out ui/views/examples/workstation.contract.yaml
      - cp blocks/ports.json ui/views/examples/ports.json
      - target/debug/agenticspec ui derive --path architectures/workstation.yaml --contract ui/views/examples/workstation.contract.yaml --ports ui/views/examples/ports.json --out ui/views/examples/workstation.ui.yaml
      - target/debug/agenticspec ui derive --path crates/agenticspec-render/tests/fixtures/large-37.yaml --out ui/views/examples/large-37.ui.yaml
      - target/debug/agenticspec sim contract architectures/team-with-console.yaml --out ui/views/examples/team-with-console.contract.yaml
      - target/debug/agenticspec ui derive --control-plane --path architectures/workstation.yaml --contract ui/views/examples/workstation.contract.yaml --ports ui/views/examples/ports.json --out ui/views/examples/workstation.control-plane.ui.yaml
      - target/debug/agenticspec ui derive --control-plane --path architectures/team-with-console.yaml --contract ui/views/examples/team-with-console.contract.yaml --ports ui/views/examples/ports.json --out ui/views/examples/team-with-console.control-plane.ui.yaml
      - target/debug/agenticspec sim contract architectures/workstation-ingress.yaml --out ui/views/examples/workstation-ingress.contract.yaml
      - target/debug/agenticspec ui derive --path architectures/workstation-ingress.yaml --contract ui/views/examples/workstation-ingress.contract.yaml --ports ui/views/examples/ports.json --out ui/views/examples/workstation-ingress.ui.yaml

  ui:panels:
    desc: Write the block panels from blocks/ - ui/views/blocks.ui.yaml (one ess-ui/1 widget per view, a gallery page per block), its fixtures in ui/views/fixtures/ and the digest of its inputs, ui/views/blocks.sources.sha256, then ui/views/serve.fixtures.json (the fixtures and ui/views/source/outcomes.json in one compact file with the digest of its sources, which the binary embeds for agenticspec ui serve). Never edited by hand.
    cmds:
      - cargo build --quiet --locked -p agenticspec
      - target/debug/agenticspec ui panels

  check:app:
    desc: Types, unit tests and a build of the app in ui/app, then its layout, accessibility, keyboard and screen-only-user gates on the fixtures and the ratchet against ux/baseline.json. The lines are in scripts/check-app.sh.
    cmds:
      - sh scripts/check-app.sh

  check:ui-kit:
    desc: Types, unit tests and a build of the gallery of the design system in ui/kit, then its axe-core, overflow and select-keyboard gates in a browser (SCREENS=1 writes target/screens). The lines are in scripts/check-ui-kit.sh.
    cmds:
      - sh scripts/check-ui-kit.sh

  check:studio:
    desc: The studio app - studio/studio.ui.yaml against the studio model, the types, unit tests and build of ui/studio, then the browser test of crates/agenticstudio/e2e (axe-core, overflow, the first slice, the 09-factory layout) against one agenticstudio serve. Playwright ends a test at 60 s and the run at 120 s. The lines are in scripts/check-studio.sh.
    cmds:
      - sh scripts/check-studio.sh

  ui:generate:
    desc: Generate the pages, router, client and runtime of the studio app (ui/studio/src/generated) from studio/studio.ui.yaml, and the widgets and pages of the block panels' gallery (ui/views/gallery/src/generated) from ui/views/blocks.ui.yaml, and the apps of the derived examples (ui/views/examples/app/src/<name>/generated) from ui/views/examples/<name>.ui.yaml, with agenticspec ui generate. task check:generated holds them.
    cmds:
      - cargo run --quiet --locked -p agenticspec -- ui generate --path studio/studio.ui.yaml --out ui/studio/src/generated
      - cargo run --quiet --locked -p agenticspec -- ui generate --path ui/views/blocks.ui.yaml --out ui/views/gallery/src/generated
      - cargo run --quiet --locked -p agenticspec -- ui generate --path ui/views/examples/workstation.ui.yaml --out ui/views/examples/app/src/workstation/generated
      - cargo run --quiet --locked -p agenticspec -- ui generate --path ui/views/examples/large-37.ui.yaml --out ui/views/examples/app/src/large-37/generated

  check:views:
    desc: The gallery of the block panels - the types and unit tests of ui/views/gallery (live re-read and patch, the scope of a widget, the fixture client), a build into target/views/gallery, then its browser test (every panel shows its fixture rows; axe-core and overflow at 1366x768 and 390x844 in both themes). Playwright ends a test at 60 s and the run at 120 s. The lines are in scripts/check-views.sh.
    cmds:
      - sh scripts/check-views.sh

  check:examples:
    desc: The derived examples - the types and unit tests of ui/views/examples/app (the fixture client), a build into target/views/examples, then its browser test (the 37-part example at 1366x768 - the parts table on the first screen, no sideways overflow, every part in one step, the reach table filtered by part, the graph with pan, zoom and fit - and the workstation's labels, frames and actions). Playwright ends a test at 60 s and the run at 120 s. The lines are in scripts/check-examples.sh.
    cmds:
      - sh scripts/check-examples.sh

  check:elements:
    desc: The package of ui/views (the block panels, part pages and overviews as Vue components) - its types and unit tests, the bundle of its custom elements into target/views/elements, the React host page into target/views/hosts, then the browser test of the elements in a plain page and a React page over one fixture server (the rows, the host's --kit-accent, the agentic-navigate and agentic-command events). Playwright ends a test at 60 s and the run at 120 s. The lines are in scripts/check-elements.sh.
    cmds:
      - sh scripts/check-elements.sh

  check:operator:
    desc: The operator UI of agenticspec ui build - the committed build of the operator app (ui/operator/built) against the digest of its sources (ui/operator/built.sources.sha256, no node), the app's types, then agenticspec ui build of the workstation into target/operator/workstation and its browser test over one static server and fixture adapter and over one agenticspec ui serve of the workstation, and the project of agenticspec ui generate --project built with vite over ui/node_modules with its packer held to the bytes of ui build --archive. Playwright ends a test at 60 s and the run at 120 s. The lines are in scripts/check-operator.sh.
    cmds:
      - sh scripts/check-operator.sh

  operator:build:
    desc: Build the operator app of ui/operator with vite into ui/operator/built (index.html, app.js, app.css, which the agenticspec binary embeds) and write the digest of its sources, ui/operator/built.sources.sha256. Run it after a change of ui/operator, ui/kit/src, ui/views/src or the generated panels; never edit the built files.
    cmds:
      - sh scripts/operator-app.sh --write

  slow:operator:
    desc: Slow lane. Build the operator app afresh into target/operator/fresh, compare its bytes with ui/operator/built, and check the digest.
    cmds:
      - sh scripts/operator-app.sh --slow

  elements:build:
    desc: Build the custom elements of ui/views (agentic-part-panel, agentic-overview, agentic-panel, agentic-block-panels and one element per panel) with Vue into target/views/elements/agentic-views.js and the kit's stylesheet into agentic-views.css; a host page loads both.
    cmds:
      - cd ui && ([ node_modules/.package-lock.json -nt package-lock.json ] || npm ci --no-audit --no-fund --loglevel=error) && npx vite build --config views/vite.config.ts --logLevel warn

  views:build:
    desc: Build the gallery of the block panels (ui/views/gallery, generated from ui/views/blocks.ui.yaml by agenticspec ui generate and held by task check:generated) into target/views/gallery; it reads the fixtures of ui/views/fixtures in the browser and needs no server.
    cmds:
      - cd ui && ([ node_modules/.package-lock.json -nt package-lock.json ] || npm ci --no-audit --no-fund --loglevel=error) && npx vite build --config views/gallery/vite.config.ts --logLevel warn

  studio:build:
    desc: Build the studio app of ui/studio into target/studio/www, which agenticstudio serve serves.
    cmds:
      - cd ui && ([ node_modules/.package-lock.json -nt package-lock.json ] || npm ci --no-audit --no-fund --loglevel=error) && npx vite build --config studio/vite.config.ts --logLevel warn

  ux:round:
    desc: Measure a round of the ui-iteration-loop into ux/rounds/R-nn (task ux:round -- R-nn). The lines are in ux/round.sh.
    cmds:
      - sh ux/round.sh {{.CLI_ARGS}}

  check:site:
    desc: Build the docs site into website/build when its inputs changed or there is none, then its layout, accessibility, keyboard, screen-only-user and page-sweep gates and the ratchet against ux/site/baseline.json. The lines are in scripts/check-site.sh.
    cmds:
      - sh scripts/check-site.sh

  ux:site-round:
    desc: Measure a round of the ui-iteration-loop of the docs site into ux/site/rounds/S-nn (task ux:site-round -- S-nn). The lines are in ux/site/round.sh.
    cmds:
      - sh ux/site/round.sh {{.CLI_ARGS}}

  check:generated:
    desc: Compare each generated directory, byte for byte, with a fresh generation. The lines are in scripts/check-generated.sh.
    cmds:
      - sh scripts/check-generated.sh

  generate:
    desc: Replace each generated directory with a fresh generation. A generated file is never edited.
    cmds:
      - sh scripts/check-generated.sh --write

  check:rust:
    desc: Format and lints of the hand-written crates.
    cmds:
      - cargo fmt --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    desc: Tests with cargo-nextest on the forge runner's 4 test threads; the flag wins over NEXTEST_TEST_THREADS, which a build pool may set. Limits in .config/nextest.toml. On GitHub Actions the profile forge ends a test at 60 s and the run at 120 s; elsewhere the default profile ends them at 30 s and 75 s (AGENTS.md § "The test step equals the forge").
    cmds:
      - cargo nextest run --workspace --locked --test-threads 4 --profile "$(if [ "${GITHUB_ACTIONS:-}" = true ]; then echo forge; else echo default; fi)"

  ui:build:
    desc: Build the hand-written app of ui/app into target/ui/www, which `agenticspec serve` serves. The lines are in scripts/ui-build.sh.
    cmds:
      - sh scripts/ui-build.sh

  sync:
    desc: Lift the new and changed Claude Code sessions of the last 72 hours into the local store.
    cmds:
      - cargo run --release --locked -p agenticspec -- sync

  serve:
    desc: Serve the UI and its views from the local store on http://127.0.0.1:7420, synced every 5 seconds.
    cmds:
      - cargo run --release --locked -p agenticspec -- serve

  analyze:
    desc: Write agenticspec-dashboard.html for the Claude Code sessions of the last 72 hours on this host.
    cmds:
      - cargo run --release --locked -p agenticspec -- analyze

  kpi:
    desc: KPIs over the Claude Code sessions of the last 72 hours on this host.
    cmds:
