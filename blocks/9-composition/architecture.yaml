# Architecture: the composed setup. Source: design/building-blocks.md, "The blocks" § 9
# composition ("Parts (instances of blocks), links (who may call or message whom), a border (what
# a human reaches), revisions. No link, no reach") and § "An architecture document" (the
# workstation example, lowered to commands in a fixed order: declare the parts, declare the links,
# commit the revision). Modelled on weft's formation (rows edited one by one, then a commit that
# freezes them into an immutable revision); nothing of weft is copied.
domain: agentic.architecture

summary: >-
  An architecture composes building blocks into one concrete setup: parts (named instances of a
  block, with a count), links (which part may call or message which, and what the link carries),
  a border (the parts a human principal reaches) and immutable revisions. No link, no reach: two
  parts without a link cannot reach each other.

naming:
  wire: architecture
  display: Architecture

types:
  - name: agentic.architecture.Digest
    kind: newtype
    of: String
    naming:
      summary: Digest of the canonical form of an architecture's parts, links and border.

  # The blocks a part may instantiate. "The blocks" lists the block domains; a pool is the
  # resource block's pool (the example's `builds: {block: resource, kind: pool}`).
  # Trigger and Schedule (agentic.trigger) are parts: what wakes an agent part is part of the
  # setup, and a link carrying Trigger says which agent part it wakes.
  # Knowledge is a part (an agent is given it). Authority (a grant, a budget, a policy), Work (a
  # spec, a body of evidence), Experiment (a comparison of runs) and Kpi (a measure the owner
  # reads) are parts too: the ladder's architectures place them, and links say who reads them.
  # Question (a standing question and its answers), Process (a defined sequence of steps) and
  # Delegation (a principal's grant to act for it) are parts when a setup models them as places
  # that agents and principals write to and read from.
  # Architecture: the part is another architecture document, referred to by `ref` (a path
  # relative to the referring document) and `digest` (`sha256:<hex>` of that file's bytes), both
  # kept as settings; its border is its interface, and a link addresses a border part as
  # `<part>.<border part>`.
  # UNMAPPED: whether the other resource kinds (queue, rate limit, cache) are parts of an
  # architecture or only of a run. No architecture places them. Taken: they are not parts.
  # UNMAPPED: a store of agentic.store is no part kind, and Carries has no Event, so an
  # architecture cannot place a store or an event bus, though Carries has Record and Read.
  # Adding them changes the command line's check, the settings table, the contract's port table
  # and every catalog digest. Open question for the owner.
  # The command line's structural check reads this list and Carries from this file, so a block
  # or a carries value that is not declared here is refused there.
  - name: agentic.architecture.PartKind
    kind: enum
    variants: [Principal, Agent, Harness, Model, Gateway, Tool, Knowledge, Channel, Workspace, Sandbox, Runtime, Pool, Trigger, Schedule, Authority, Work, Experiment, Kpi, Question, Process, Delegation, Architecture]

  # What a link carries. The example writes `carries: question`, `order`, `claim`; a link with no
  # `carries:` (`worker -> gateway`) is a model call, and `owner -> operator over chat` a prompt.
  # Trigger: a trigger or schedule part wakes an agent or runtime part. Review: a task reported done goes to
  # a reviewer agent. Handoff: one agent hands its result to the next. Call: an agent runs a tool.
  # Context: knowledge or a contract is given to an agent. Grant: an authority part permits an
  # agent. Proposal: an agent proposes a change to its owner. Spec: a written task goes to work
  # or to an agent. Checkout: a workspace is checked out for a run. Result: a run reports to an
  # experiment. Report: an experiment, evidence or a KPI reports to a person. Record: an agent or
  # a team records evidence. Read: a part reads work, a question or a record it is given access
  # to. Run: an agent hands a run to a runtime part, which executes its steps.
  - name: agentic.architecture.Carries
    kind: enum
    variants: [Prompt, Order, Question, Answer, ModelCall, ToolCall, Claim, Message, Trigger, Review, Handoff, Call, Context, Grant, Proposal, Spec, Checkout, Result, Report, Record, Read, Run]

  # How the copies of an agent part (a swarm) coordinate: Orchestrator, one copy or another part
  # hands out the work; Board, the copies read and write a typed board without an orchestrator
  # (2609.26781: 19.31% resolved at 1 agent, 28.78% at 128); Mesh, the copies message each other
  # directly; None, they do not coordinate.
  - name: agentic.architecture.Coordination
    kind: enum
    variants: [Orchestrator, Board, Mesh, None]

  # A part's block-specific settings: the example's `harness: coding`, `slots: 16`,
  # `sharing: exclusive`, `egress: [gateway]`, `upstreams: [provider]`; an experiment's mutation
  # names a part and one of these (`{part: builds, field: slots}`).
  # Taken: the settings a part of each block may carry are declared in blocks/settings.yaml
  # (agenticspec-settings/1), one table, each with its type (number or integer with unit and
  # range, boolean, enum, duration, string, the name of another part), its default and the ports
  # it narrows; an enum is a block's own where the block declares one (a pool's kind is
  # agentic.resource.PoolKind). The check refuses a setting the table does not declare for the
  # part's block and a value outside its type. This domain keeps a setting as named text.
  - name: agentic.architecture.Setting
    kind: struct
    fields:
      - {name: name, type: String}
      - {name: value, type: String}

  # The transform verbs of a patch rule's head (`agenticspec-patch/1`). Source: epic
  # agenticstudio § "Operations: select, then transform": set a field, add or remove a part or
  # link, connect two selections, replicate (count), wrap a link or part with a guard part,
  # prepend or append on a link, mark or unmark a place for optimization.
  # UNMAPPED: Remove, Wrap, Prepend and Append re-point or drop links and parts, and this domain
  # declares no command that removes a part or a link. Open question for story
  # architecture-patches: RemovePart and RemoveLink as commands, or a patch applies to a fresh
  # architecture rebuilt from the base revision.
  - name: agentic.architecture.PatchVerb
    kind: enum
    variants: [Set, Add, Remove, Connect, Replicate, Wrap, Prepend, Append, Mark, Unmark]

  # One rule of a patch: its head's verb and the rule as written, a selector in the query
  # language of `queries/*.sq` over the architecture facts (`part`, `link`, `policy`, `marker`,
  # `kpi`) and the transform. The applier parses the text; this domain keeps it.
  - name: agentic.architecture.PatchRule
    kind: struct
    fields:
      - {name: verb, type: agentic.architecture.PatchVerb}
      - {name: text, type: String}

  # Placements (M45). The qualified name of the entity a placement names: the entity a part
  # stands for (`agentic.harness.HarnessSession`, `agentic.workspace.Workspace`, ...). A lower
  # block's entity is named by text, since this block cannot list the entities of every block
  # below it as a closed type.
  - name: agentic.architecture.EntityName
    kind: newtype
    of: String
    naming:
      summary: The qualified name of an entity of a building block, such as agentic.harness.HarnessSession.

  # The ports and the contract. Source: design/architecture-runtime.md § "The boundary: ports"
  # and § "The contract of one architecture". A port is a leaf of the blocks with effects outside
  # them, the part a runtime must implement; everything else is behaviour or computation that the
  # specification runs. Ports are derived from this system, never authored: from its bindings
  # (which command an event causes) and its lifecycles (which state only an entry command
  # leaves). An entry command is one no binding causes; an exit event is one no binding consumes.
  # The contract of an architecture revision is the ports its parts use, narrowed by their
  # settings, with the routing invariants of its links and the number of instances of each port.

  # The full name of a command of this system (`agentic.model.StartInference`).
  # ESS limit (0.99.2): a field cannot reference a command, so the name is text. The derivation
  # writes only names the compiled blocks declare.
  - name: agentic.architecture.CommandName
    kind: newtype
    of: String
    naming:
      summary: The full name of a command of the building blocks.

  # The full name of an event of this system (`agentic.model.InferenceStarted`). Text for the
  # reason CommandName is.
  - name: agentic.architecture.EventName
    kind: newtype
    of: String
    naming:
      summary: The full name of an event of the building blocks.

  # A lifecycle state of an entity of this system, as `<entity>.<state>`
  # (`agentic.model.Inference.Started`). Text for the reason CommandName is.
  - name: agentic.architecture.StateName
    kind: newtype
    of: String
    naming:
      summary: A lifecycle state of an entity of the building blocks.

  # The order of a port's commands, as a regular expression over their short names
  # (`StartInference FinishInference`, `OpenSession (RecordTurn | CompactContext)* EndSession`).
  - name: agentic.architecture.Protocol
    kind: newtype
    of: String
    naming:
      summary: A regular expression over the short names of a port's commands, intent first.

  # What kind of outside a port reaches.
  # Outbound: an exit event leaves its entity in a state whose only way out is an entry command;
  # the world must act and report (InferenceStarted leaves an inference Started, which only
  # FinishInference leaves). Clock: a periodic host cause or a clock-reading attachment of a
  # binding. Principal: entry commands a principal issues (Answer, ApproveDecision).
  # Not a port, and so not a variant: an internal command (a binding causes it, or it decides on
  # recorded facts) and a configuration command (an entry command whose entity has no waiting
  # state: RegisterPrincipal, DefineAgent, DefineKpi), which the deployer issues from the
  # architecture document.
  - name: agentic.architecture.PortKind
    kind: enum
    variants: [Outbound, Clock, Principal]

  # One port one part of the revision uses: the settings of the part that narrow it, and how
  # many instances of the port run (the part's count, times the count of the part it is `per`, as
  # far as that chain goes).
  # Which part uses which port, taken (`agenticspec sim contract`, docs/contract.md): a fixed
  # table from a part's block to the ports it uses by being there (agent: harness.session; model:
  # model.inference; gateway: gateway.call; pool: resource.claim; a direct channel:
  # channel.message, a topic, queue or board: channel.post and channel.subscription; workspace:
  # workspace.lease and workspace.proposal; sandbox: sandbox.sandbox; schedule: trigger.schedule,
  # and trigger.firing unless a trigger part fires on it; trigger: trigger.firing; authority:
  # authority.decision, or authority.budget for a budget; runtime: runtime.instance). Principal,
  # tool, knowledge, work, experiment and kpi parts use none by being there. A link adds the port
  # its carried value travels in to its `from` part (an agent's model_call: model.inference; a
  # question: question.question; a call to a tool: harness.tool-call; a claim: resource.claim; a
  # message, or any value sent to a channel part or over one: the channel's sending port), and a
  # principal a question reaches uses question.question too.
  # Which settings narrow which port, taken: those blocks/settings.yaml marks as narrowing it,
  # copied from the using part (agent: harness, role, acts_for; model: route; gateway:
  # rate_limit_per_minute; pool: kind, capacity, job_limit; channel: kind, distribution; sandbox:
  # isolation, egress; workspace: kind, sharing; ...); any other setting is not copied.
  - name: agentic.architecture.ContractPort
    kind: struct
    fields:
      - {name: port_id, type: agentic.shared.PortId}
      - {name: part_id, type: agentic.shared.PartId}
      - {name: settings, type: List<agentic.architecture.Setting>}
      - {name: instances, type: Integer}

  # What one link of the revision promises about a run's trace: `worker -> gateway carries
  # model_call` means every `model.infer` of `worker` happens inside a `gateway.call` of
  # `gateway`. `predicate` is the predicate as the contract writes it, in the predicate language
  # of docs/contract.md.
  # Taken for every carried value: a link whose value travels in a port of its `from` part (see
  # ContractPort) has one invariant on that port. A model_call from an agent to a gateway nests:
  # `every model.inference@<from> inside gateway.call@<to>`. Every other such link restricts the
  # counterparty: `every <port>@<from> to <to>`, with `over <channel>` when the link names one;
  # `within_port_id` is then absent. A link whose value travels in no port (an order, a review, a
  # result, a handoff, a report, a spec, a context, a record, a prompt not over a channel) has no
  # invariant.
  - name: agentic.architecture.RoutingInvariant
    kind: struct
    fields:
      - {name: link_id, type: agentic.shared.LinkId}
      - {name: port_id, type: agentic.shared.PortId}
      - {name: within_port_id, type: Optional<agentic.shared.PortId>}
      - {name: predicate, type: String}

  # The ingress: how an architecture exposes interfaces to the outside. Source: design/ingress.md
  # (I1, I7, I8). An ingress names its audience (a principal part), one interface (what the
  # audience may use) and one or more exports (over which protocol). Its interface is resolved
  # by the contract derivation into operations, each a command, a view, a feed (an event) or a
  # metric (a KPI of the catalogue).
  - name: agentic.architecture.OperationKind
    kind: enum
    variants: [Command, View, Feed, Metric]

  # The protocols an export may name (design/ingress.md I7); a field adds no protocol.
  - name: agentic.architecture.ExportProtocol
    kind: enum
    variants: [Http, EventStream, Cli, Tool, Agent, MetricsScrape, Ui]

  # One operation of a resolved interface: its kind and the full name of the command, view or
  # event, or the KPI's id. ESS limit (0.99.2): a field cannot reference a command, view or
  # event, so the name is text; the derivation writes only names the compiled blocks declare and
  # ids of kpis/catalogue.yaml.
  - name: agentic.architecture.ContractOperation
    kind: struct
    fields:
      - {name: kind, type: agentic.architecture.OperationKind}
      - {name: name, type: String}

  # One ingress of a contract: the audience, whether callers authenticate, the protocols of its
  # exports and the operations its interface resolves to. Derived, never authored.
  - name: agentic.architecture.ContractIngress
    kind: struct
    fields:
      - {name: ingress_id, type: agentic.shared.IngressId}
      - {name: audience_part_id, type: agentic.shared.PartId}
      - {name: authenticated, type: Boolean}
      - {name: protocols, type: List<agentic.architecture.ExportProtocol>}
      - {name: operations, type: List<agentic.architecture.ContractOperation>}

entities:
  # UNMAPPED: the brief names the lifecycle "Draft -> Committed revisions, Retired". An outcome
  # that records a revision creates the revision row, and ESS admits no second effect beside a
  # creation (ESS-COMMAND-009, `unsupported_construct`: "creates its subject and declares
  # `affects:`"), so the architecture cannot move to Committed in the commit itself. Taken: the
  # architecture is Draft (editable) until retired, and "committed" is "has a revision", read
  # through the Revisions view and, in agentic.experiment, through a row-set guard.
  - name: agentic.architecture.Architecture
    naming:
      summary: One composed setup, edited as parts, links and a border, frozen by each commit into a revision.
    identity:
      name: architecture_id
      type: agentic.shared.ArchitectureId
    fields:
      - name: name
        type: agentic.shared.Name
    relations:
      - {name: parts, kind: owns, target: agentic.architecture.Part, cardinality: many, via: architecture_id}
      - {name: links, kind: owns, target: agentic.architecture.Link, cardinality: many, via: architecture_id}
      - {name: revisions, kind: owns, target: agentic.architecture.ArchitectureRevision, cardinality: many, via: architecture_id}
      - {name: patch_applications, kind: owns, target: agentic.architecture.PatchApplication, cardinality: many, via: architecture_id}
      - {name: ingresses, kind: owns, target: agentic.architecture.Ingress, cardinality: many, via: architecture_id}
      # UNMAPPED: whether an architecture owns its revisions' contracts (a contract is derived, so
      # deleting the architecture could drop them) or a contract only references its revision.
      # Taken: references, from the contract.
    lifecycle:
      initial: Draft
      states:
        - {name: Draft, summary: "Takes parts, links, a border and commits."}
        - {name: Retired, summary: "Takes no edit and no commit; its revisions stay."}
      terminal: [Retired]
      transitions:
        - {name: retire, from: [Draft], to: Retired}

  # A named instance of a block. `count` copies of it run; `per` names another part when there
  # is one copy for each copy of that part (`tree: {per: worker}`); `acts_for` names the principal
  # part an agent part acts for (`operator: {acts_for: owner}`).
  - name: agentic.architecture.Part
    naming:
      summary: A named instance of a building block inside one architecture.
    identity:
      name: part_id
      type: agentic.shared.PartId
    fields:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: name, type: agentic.shared.Name}
      - {name: kind, type: agentic.architecture.PartKind}
      - {name: count, type: Integer}
      - {name: per_part_id, type: Optional<agentic.shared.PartId>}
      - {name: acts_for_part_id, type: Optional<agentic.shared.PartId>}
      - {name: settings, type: List<agentic.architecture.Setting>}
      # On the border: a human principal reaches this part from outside the architecture.
      - {name: on_border, type: Boolean}
      # A swarm: how the copies of an agent part coordinate, and the time between the starts of
      # two copies. A new part does not coordinate and starts its copies at once; SetSwarm sets
      # both.
      # UNMAPPED: the stagger figures (2609.26781 started one agent every 30 s, then every 3 s) come
      # from the task brief; design/research-findings.md does not list them. Taken: a Duration with
      # no default and no bound.
      - {name: coordination, type: agentic.architecture.Coordination}
      - {name: start_stagger, type: Optional<Duration>}
    invariants:
      - count >= 1
    relations:
      - {name: per, kind: references, target: agentic.architecture.Part, cardinality: one, via: per_part_id}
      - {name: acts_for, kind: references, target: agentic.architecture.Part, cardinality: one, via: acts_for_part_id}
    # UNMAPPED: the design names no removal of a part or a link. Taken: none; a changed setup is a
    # new architecture or a further commit of added rows.
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # An allowed call or message from one part to another of the same architecture. Default deny:
  # no row, no reach. The kinds of both ends are copied from the parts when the link is added, so
  # a commit can test a part's links without a second hop.
  - name: agentic.architecture.Link
    naming:
      summary: An allowed call or message from one part to another of the same architecture, carrying one kind of traffic.
    identity:
      name: link_id
      type: agentic.shared.LinkId
    fields:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: from_part_id, type: agentic.shared.PartId}
      - {name: to_part_id, type: agentic.shared.PartId}
      - {name: carries, type: agentic.architecture.Carries}
      - {name: over_part_id, type: Optional<agentic.shared.PartId>}
      - {name: from_kind, type: agentic.architecture.PartKind}
      - {name: to_kind, type: agentic.architecture.PartKind}
    relations:
      - {name: from, kind: references, target: agentic.architecture.Part, cardinality: one, via: from_part_id}
      - {name: to, kind: references, target: agentic.architecture.Part, cardinality: one, via: to_part_id}
      - {name: over, kind: references, target: agentic.architecture.Part, cardinality: one, via: over_part_id}
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # Immutable: one state, no transition, no command that changes it.
  - name: agentic.architecture.ArchitectureRevision
    naming:
      summary: An immutable snapshot of an architecture's parts, links and border.
    identity:
      name: revision_id
      type: agentic.shared.ArchitectureRevisionId
    fields:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      # 1 for the first revision of an architecture, one more for each next. Minted.
      - {name: number, type: Integer}
      - {name: digest, type: agentic.architecture.Digest}
    invariants:
      - number >= 1
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # A patch (`agenticspec-patch/1`): an ordered list of selector and transform rules. Source:
  # epic agenticstudio § "Operations: select, then transform". The user, the studio agent and the
  # optimizer change an architecture by patches only. A patch names no architecture: its
  # selectors bind parts and links by their facts, so one patch applies to any architecture
  # (the optimizer applies one mutation patch to many variants). Immutable once recorded.
  - name: agentic.architecture.Patch
    naming:
      summary: An ordered list of selector and transform rules that changes an architecture as one revision.
    identity:
      name: patch_id
      type: agentic.shared.PatchId
    fields:
      - {name: name, type: Optional<agentic.shared.Name>}
      - {name: rules, type: List<agentic.architecture.PatchRule>}
      - {name: digest, type: agentic.architecture.Digest}
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # One application of a patch to an architecture. The applier compiles the rules to this
  # domain's commands (AddPart, AddLink, SetPer, SetSwarm, ...) on a copy, and either runs them
  # with CommitRevision as one revision, or changes nothing and names the refusing rule and its
  # error. A dry run answers the same way and never commits a revision. Requested is the
  # application before the applier reports, as an experiment is Running before its variants.
  # The revision a patch applied on is the one the previous applied application of the same
  # architecture committed; a stale base is the applier's refusal.
  # UNMAPPED: the closed list of a patch's own errors (an unparsable rule, an unknown verb, an
  # unbound variable, a stale base) is not written down anywhere; `error` holds the name of the
  # error as text, a patch error or the error of the architecture command that refused, until
  # story architecture-patches settles the list.
  - name: agentic.architecture.PatchApplication
    naming:
      summary: One application of a patch to an architecture, applied as one revision or refused whole with the rule and its error.
    identity:
      name: application_id
      type: agentic.shared.PatchApplicationId
    fields:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: patch_id, type: agentic.shared.PatchId}
      - {name: dry_run, type: Boolean}
      # Applied, not a dry run: the revision the patch committed.
      - {name: revision_id, type: Optional<agentic.shared.ArchitectureRevisionId>}
      # Applied: how many rows (parts, links, settings) the patch changed.
      - {name: changed_rows, type: Optional<Integer>}
      # Refused: the 1-based position of the refusing rule, absent when the check of the whole
      # result refused (CommitRevision's refusals), and the error's name.
      - {name: rule_index, type: Optional<Integer>}
      - {name: error, type: Optional<String>}
    relations:
      - {name: patch, kind: references, target: agentic.architecture.Patch, cardinality: one, via: patch_id}
      - {name: revision, kind: references, target: agentic.architecture.ArchitectureRevision, cardinality: one, via: revision_id}
    lifecycle:
      initial: Requested
      states:
        - {name: Requested, summary: "Submitted; the applier has not reported."}
        - {name: Applied, summary: "Every rule applied; committed as one revision unless a dry run."}
        - {name: Refused, summary: "One rule or the check refused; nothing changed."}
      terminal: [Applied, Refused]
      transitions:
        - {name: apply, from: [Requested], to: Applied}
        - {name: refuse, from: [Requested], to: Refused}

  # Placements (M45). Where an entity of a lower block sits: on which part of one revision of an
  # architecture, and on which copy of it. A lower block cannot name a part: a block names only
  # its own layer or a lower one, and parts are layer 9. So the edge is turned around and this
  # block records the placement. The runtime records one through PlaceEntity when it creates an
  # entity for a part (a harness session for an agent part, a workspace for a workspace part).
  # Immutable once recorded.
  #
  # The part path is the part's name, copied from the part when the placement is recorded. A
  # nested architecture (story architecture-references, `team.lead`) is lowered to these commands
  # flat, its parts named by their path, so `team.lead` is the name of one part here.
  # UNMAPPED: a nested part as a part of its own (a part kind that is an architecture) does not
  # exist in this block yet. Taken: the flat lowering above, until story
  # architecture-references gives the block one.
  #
  # The instance is the 1-based copy of a part that runs several (`count` above 1, or `per`
  # another part), absent for a placement on the part as a whole.
  #
  # The scope rule (O3 A). A row of a block view is in scope of a part, or of one copy of it, when
  #   1. the row's own identity is the entity id of a placement to that part (and copy), or
  #   2. an id field of the row's view, one hop away, is: a turn of agentic.harness.Turns is in
  #      scope of `team.lead` when its `harness_session_id` names a harness session placed to
  #      `team.lead`.
  # A row that matches neither is out of scope. A placement of the same entity to another part
  # puts the row in that part's scope too. No second hop is followed: a row reached only through a
  # chain of two references (a step of a run of a harness session) is in scope only when the
  # runtime places the middle entity as well. A read scoped to an architecture and no part keeps
  # every row with a placement in that architecture. The runtime answers a scoped read with the
  # rows of this rule; this block records the placements the rule reads, and the Placements view
  # serves them.
  - name: agentic.architecture.Placement
    naming:
      summary: >-
        Where one entity of a lower block sits in an architecture: the revision, the part's path,
        the copy of the part, and the entity's name and id. A row of a block view is in scope of
        a part when its own id, or an id field of its view one hop away, is placed to that part.
    identity:
      name: placement_id
      type: agentic.shared.PlacementId
    fields:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: revision_id, type: agentic.shared.ArchitectureRevisionId}
      - {name: part_id, type: agentic.shared.PartId}
      - {name: part_path, type: agentic.shared.Name}
      - {name: instance, type: Optional<Integer>}
      - {name: entity_name, type: agentic.architecture.EntityName}
      - {name: entity_id, type: Uuid}
    relations:
      - {name: architecture, kind: references, target: agentic.architecture.Architecture, cardinality: one, via: architecture_id}
      - {name: revision, kind: references, target: agentic.architecture.ArchitectureRevision, cardinality: one, via: revision_id}
      - {name: part, kind: references, target: agentic.architecture.Part, cardinality: one, via: part_id}
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # A port of a block, derived from this system (`model.infer`: the exit event InferenceStarted
  # leaves an inference Started, which only the entry command FinishInference leaves). A runtime
  # implements ports; everything else of a block it gets from the specification. Immutable: a
  # change of the blocks derives the ports again.
  # `block` is the domain of the port's commands without `agentic.` (`model`, `harness`).
  # ESS limit (0.99.2): a field cannot name a domain, so it is a name.
  # `intent_event` and `waiting_state` are absent for a Clock port, which no event of the blocks
  # starts. `reports` are the entry commands that leave the waiting state (an Outbound or
  # Principal port), or the commands the periodic cause invokes (a Clock port). `protocol` orders
  # the command that emits the intent event and the reports.
  # The table in design/architecture-runtime.md § "The boundary: ports" is the output the
  # derivation is expected to give, not a source of this entity.
  - name: agentic.architecture.Port
    naming:
      summary: A leaf of the building blocks with effects outside them, which a runtime must implement.
    identity:
      name: port_id
      type: agentic.shared.PortId
    fields:
      - {name: name, type: agentic.shared.Name}
      - {name: block, type: agentic.shared.Name}
      - {name: kind, type: agentic.architecture.PortKind}
      - {name: intent_event, type: Optional<agentic.architecture.EventName>}
      - {name: waiting_state, type: Optional<agentic.architecture.StateName>}
      - {name: reports, type: List<agentic.architecture.CommandName>}
      - {name: protocol, type: agentic.architecture.Protocol}
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # The contract of one architecture revision (`agenticspec-contract/1`): the ports its parts
  # use with their narrowing settings and instances, the routing invariants of its links, and its
  # border (the only parts that take input from outside). Derived from the revision and the
  # ports, without any runtime, so one revision has at most one contract. Immutable.
  - name: agentic.architecture.Contract
    naming:
      summary: The ports one architecture revision uses, narrowed by its settings, with the routing invariants of its links.
    identity:
      name: contract_id
      type: agentic.shared.ContractId
    fields:
      - {name: revision_id, type: agentic.shared.ArchitectureRevisionId}
      - {name: digest, type: agentic.architecture.Digest}
      - {name: ports, type: List<agentic.architecture.ContractPort>}
      - {name: invariants, type: List<agentic.architecture.RoutingInvariant>}
      - {name: border, type: List<agentic.shared.PartId>}
      # The ingresses of the revision, each interface resolved; empty when it declares none.
      - {name: ingress, type: List<agentic.architecture.ContractIngress>}
    relations:
      - {name: revision, kind: references, target: agentic.architecture.ArchitectureRevision, cardinality: one, via: revision_id}
      - {name: border_parts, kind: references, target: agentic.architecture.Part, cardinality: many, via: border}
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # An ingress of an architecture (design/ingress.md I1, I3, I6): for whom it is reachable from
  # outside. `audience_part_id` is a principal part of the same architecture; `interface` holds
  # the interface's selection rules as written (`scope`, `commands`, `views`, `feeds`,
  # `metrics`), as a patch rule keeps its text: the contract derivation reads them. Callers
  # authenticate unless `authenticated` is false, which the document's check admits only for an
  # interface without commands. Immutable once added, like a part.
  - name: agentic.architecture.Ingress
    naming:
      summary: For whom an architecture is reachable from outside, what that audience may use, and whether callers authenticate.
    identity:
      name: ingress_id
      type: agentic.shared.IngressId
    fields:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: name, type: agentic.shared.Name}
      - {name: audience_part_id, type: agentic.shared.PartId}
      - {name: authenticated, type: Boolean}
      - {name: interface, type: String}
    relations:
      - {name: audience, kind: references, target: agentic.architecture.Part, cardinality: one, via: audience_part_id}
      - {name: exports, kind: owns, target: agentic.architecture.Export, cardinality: many, via: ingress_id}
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # One export of an ingress: the protocol its interface is served over (design/ingress.md I7).
  # Its projection (an OpenAPI document, a stream list, a tool list, a metric list) is generated,
  # never authored; its address, server and authenticator are the runtime binding's.
  - name: agentic.architecture.Export
    naming:
      summary: The protocol an ingress's interface is served over.
    identity:
      name: export_id
      type: agentic.shared.ExportId
    fields:
      - {name: ingress_id, type: agentic.shared.IngressId}
      - {name: protocol, type: agentic.architecture.ExportProtocol}
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

# The Viewer reads the views of this block. The Deployer and the Principal are two roles that
# cross every block, read by the contract of an architecture. `agenticspec sim ports` reads
# their `may:` lists to tell the commands of a port from configuration (docs/contract.md): ESS
# 0.99.2 gives an actor no kind, so the two roles the derivation needs are named here, once, for
# all blocks.
actors:
  - name: agentic.architecture.Viewer
    naming:
      display: Architecture viewer
      summary: >-
        Whoever looks at architectures, their parts, links, revisions and patches, such as an
        operator's view of a running system. It reads the views of this block and issues none of
        its commands.
    may:
      - agentic.architecture.Architectures
      - agentic.architecture.Parts
      - agentic.architecture.Reach
      - agentic.architecture.Revisions
      - agentic.architecture.Patches
      - agentic.architecture.PatchApplications
      - agentic.architecture.Ports
      - agentic.architecture.Contracts
  - name: agentic.architecture.Deployer
    naming:
      display: Deployer
      summary: >-
        Whoever sets a system up from its architecture document, switches what it set up on and
        off, and takes it down: retires principals, agents, models, routes, harnesses, tools,
        knowledge, processes, KPIs, sandboxes and architectures, drains and stops gateways,
        closes channels, revokes grants and delegations, enables and disables triggers and
        schedules, revises knowledge and places workloads. What the deployer issues is configuration; nothing outside the system waits
        on it. UNMAPPED: the deployer also issues the commands that set these up
        (RegisterPrincipal, DefineAgent, DefineKpi, OpenChannel, ...); listing them here made
        the synthesis of the conformance suite about 30 s slower (a caller witness per command),
        and the derivation of ports reads only the commands that move a state on.
    attributes:
      - {name: party, type: agentic.channel.PartyId}
      - {name: party_kind, type: agentic.channel.PartyKind}
    may:
      - agentic.principal.RetirePrincipal
      - agentic.delegation.RevokeDelegation
      - agentic.model.RetireModel
      - agentic.model.RetireRoute
      - agentic.gateway.DrainGateway
      - agentic.gateway.StopGateway
      - agentic.gateway.DetachUpstream
      - agentic.tool.WithdrawTool
      - agentic.knowledge.ReviseKnowledge
      - agentic.knowledge.WithdrawKnowledge
      - agentic.agent.RetireAgent
      - agentic.agent.RetireRevision
      - agentic.harness.RetireHarness
      - agentic.process.WithdrawProcess
      - agentic.authority.RevokeGrant
      - agentic.channel.CloseChannel
      - agentic.channel.CloseSharedChannel
      - agentic.trigger.PassScheduleChecks
      - agentic.trigger.EnableSchedule
      - agentic.trigger.DisableSchedule
      - agentic.trigger.EnableTrigger
      - agentic.trigger.DisableTrigger
      - agentic.sandbox.RetireSandbox
      - agentic.runtime.DefineWorkload
      - agentic.kpi.RetireKpi
      - agentic.architecture.RetireArchitecture
      - agentic.deployment.StopDeployment

  - name: agentic.architecture.Principal
    naming:
      display: Principal
      summary: >-
        A principal acting in a running system: a person, or an agent acting for one under a
        delegation, who answers a question, approves or rejects a pending decision, or accepts or
        rejects a deliverable. What it issues ends a wait on a principal.
    attributes:
      - {name: party, type: agentic.channel.PartyId}
    may:
      - agentic.question.Answer
      - agentic.authority.ApproveDecision
      - agentic.authority.RejectDecision
      - agentic.work.AcceptDeliverable
      - agentic.work.RejectDeliverable

errors:
  - name: agentic.architecture.NoSuchArchitecture
    summary: No architecture has this id, and nothing changed.
  - name: agentic.architecture.RetiredArchitecture
    summary: The architecture is retired, so it takes no edit and no commit, and nothing changed.
  - name: agentic.architecture.InvalidCount
    summary: A part runs at least one copy, and nothing was added.
  - name: agentic.architecture.PartNameTaken
    summary: The architecture already has a part of this name, and nothing was added.
  - name: agentic.architecture.NoSuchPart
    summary: A part this request names does not exist, and nothing changed.
  - name: agentic.architecture.ForeignPart
    summary: A part this request names belongs to another architecture, and nothing changed.
  - name: agentic.architecture.ActsForNeedsAgent
    summary: Only an agent part acts for a principal, and nothing was added.
  - name: agentic.architecture.ActsForNotPrincipal
    summary: An agent part acts for a principal part, and the part named is not one; nothing was added.
  - name: agentic.architecture.SwarmNeedsAgent
    summary: Only the copies of an agent part coordinate as a swarm, and nothing changed.
  - name: agentic.architecture.TriggerSourceNotTrigger
    summary: A link carrying Trigger starts at a trigger or schedule part, and the part named is neither; nothing was added.
  - name: agentic.architecture.TriggerTargetNotAgent
    summary: A link carrying Trigger wakes an agent part, and the part named is not one; nothing was added.
  - name: agentic.architecture.SelfReference
    summary: A link, a per or an acts-for names the part itself, and nothing changed.
  - name: agentic.architecture.NotAChannel
    summary: A link travels over a channel part, and the part named is not one; nothing was added.
  - name: agentic.architecture.TargetCannotAnswer
    summary: A link carrying questions ends at a principal or an agent part, the only parts that answer; nothing was added.
  - name: agentic.architecture.LinkExists
    summary: The architecture already has this link, and nothing was added.
  - name: agentic.architecture.NotReachedByPrincipal
    summary: The architecture has a principal part, and neither a link from one nor a link carrying Grant reaches this part, so it cannot be on the border; nothing changed.
  - name: agentic.architecture.EmptyArchitecture
    summary: The architecture has no part, so no revision was recorded.
  - name: agentic.architecture.AgentWithoutModel
    summary: An agent part has no link carrying model calls to a model or gateway part, so no revision was recorded.
  - name: agentic.architecture.QuestionWithoutAnswerer
    summary: A link carries questions to an agent part that acts for no principal and forwards questions to none, in an architecture that has a principal part, so no party may answer and no revision was recorded.
  - name: agentic.architecture.GatewayWithoutModel
    summary: A gateway part has no link carrying model calls to a model part, so the calls it passes reach no model and no revision was recorded.
  - name: agentic.architecture.EmptyPatch
    summary: A patch has at least one rule, and nothing was recorded.
  - name: agentic.architecture.NoSuchPatch
    summary: No patch has this id, and nothing changed.
  - name: agentic.architecture.NoSuchRevision
    summary: No architecture revision has this id, and nothing changed.
  - name: agentic.architecture.NoSuchPatchApplication
    summary: No patch application has this id, and nothing changed.
  - name: agentic.architecture.PatchApplicationSettled
    summary: The patch application was already applied or refused, and nothing changed.
  - name: agentic.architecture.AppliedWithoutRevision
    summary: A patch applied outside a dry run names the revision it committed, and nothing changed.
  - name: agentic.architecture.InvalidRuleIndex
    summary: A rule's position starts at 1, and nothing changed.
  - name: agentic.architecture.PortNameTaken
    summary: A port of this name is already declared, and nothing was declared.
  - name: agentic.architecture.EmptyContract
    summary: A contract names at least one port, and nothing was recorded.
  - name: agentic.architecture.ContractExists
    summary: The revision already has a contract, and nothing was recorded.
  - name: agentic.architecture.IngressNameTaken
    summary: The architecture already has an ingress of this name, and nothing was added.
  - name: agentic.architecture.AudienceNotPrincipal
    summary: The audience of an ingress is a principal part, and the part named is not one; nothing was added.
  - name: agentic.architecture.NoSuchIngress
    summary: No ingress has this id, and nothing was added.
  - name: agentic.architecture.ExportExists
    summary: The ingress already exports over this protocol, and nothing was added.

  # Placements (M45).
  - name: agentic.architecture.ForeignRevision
    summary: The revision belongs to another architecture, and nothing was placed.
  - name: agentic.architecture.PartNotInRevision
    summary: The part belongs to another architecture than the revision, so it is not in that revision; nothing was placed.
  - name: agentic.architecture.InvalidInstance
    summary: A copy of a part is counted from 1, and nothing was placed.
  - name: agentic.architecture.InstanceWithoutCopies
    summary: The part runs one copy and is per no other part, so a placement names no copy of it; nothing was placed.
  - name: agentic.architecture.InstanceOutOfRange
    summary: The part runs fewer copies than the copy named, and nothing was placed.
  - name: agentic.architecture.PlacementExists
    summary: The entity is already placed to this part of this revision, and nothing was placed.

events:
  - name: agentic.architecture.ArchitectureCreated
    fields:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: name, type: agentic.shared.Name}
  - name: agentic.architecture.PartAdded
    fields:
      - {name: part_id, type: agentic.shared.PartId}
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: name, type: agentic.shared.Name}
      - {name: kind, type: agentic.architecture.PartKind}
      - {name: count, type: Integer}
  - name: agentic.architecture.LinkAdded
    fields:
      - {name: link_id, type: agentic.shared.LinkId}
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: from_part_id, type: agentic.shared.PartId}
      - {name: to_part_id, type: agentic.shared.PartId}
      - {name: carries, type: agentic.architecture.Carries}
  - name: agentic.architecture.PartPerSet
    fields:
      - {name: part_id, type: agentic.shared.PartId}
      - {name: per_part_id, type: agentic.shared.PartId}
  - name: agentic.architecture.AgentActsFor
    fields:
      - {name: part_id, type: agentic.shared.PartId}
      - {name: principal_part_id, type: agentic.shared.PartId}
  - name: agentic.architecture.SwarmSet
    fields:
      - {name: part_id, type: agentic.shared.PartId}
      - {name: coordination, type: agentic.architecture.Coordination}
      - {name: start_stagger, type: Optional<Duration>}
  - name: agentic.architecture.PartBordered
    fields:
      - {name: part_id, type: agentic.shared.PartId}
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
  - name: agentic.architecture.RevisionCommitted
    fields:
      - {name: revision_id, type: agentic.shared.ArchitectureRevisionId}
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: number, type: Integer}
      - {name: digest, type: agentic.architecture.Digest}
  - name: agentic.architecture.ArchitectureRetired
    fields:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
  - name: agentic.architecture.PatchRecorded
    fields:
      - {name: patch_id, type: agentic.shared.PatchId}
      - {name: digest, type: agentic.architecture.Digest}
  - name: agentic.architecture.PatchRequested
    fields:
      - {name: application_id, type: agentic.shared.PatchApplicationId}
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: patch_id, type: agentic.shared.PatchId}
      - {name: dry_run, type: Boolean}
  - name: agentic.architecture.PatchApplied
    fields:
      - {name: application_id, type: agentic.shared.PatchApplicationId}
      - {name: revision_id, type: agentic.shared.ArchitectureRevisionId}
      - {name: changed_rows, type: Integer}
  - name: agentic.architecture.DryRunApplied
    fields:
      - {name: application_id, type: agentic.shared.PatchApplicationId}
      - {name: changed_rows, type: Integer}
  - name: agentic.architecture.PatchRefused
    fields:
      - {name: application_id, type: agentic.shared.PatchApplicationId}
      - {name: rule_index, type: Optional<Integer>}
      - {name: error, type: String}
  - name: agentic.architecture.PortDeclared
    fields:
      - {name: port_id, type: agentic.shared.PortId}
      - {name: name, type: agentic.shared.Name}
      - {name: block, type: agentic.shared.Name}
  - name: agentic.architecture.ContractRecorded
    fields:
      - {name: contract_id, type: agentic.shared.ContractId}
      - {name: revision_id, type: agentic.shared.ArchitectureRevisionId}
      - {name: digest, type: agentic.architecture.Digest}
  - name: agentic.architecture.IngressAdded
    fields:
      - {name: ingress_id, type: agentic.shared.IngressId}
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: name, type: agentic.shared.Name}
      - {name: audience_part_id, type: agentic.shared.PartId}
  - name: agentic.architecture.ExportAdded
    fields:
      - {name: export_id, type: agentic.shared.ExportId}
      - {name: ingress_id, type: agentic.shared.IngressId}
      - {name: protocol, type: agentic.architecture.ExportProtocol}

  # Placements (M45).
  - name: agentic.architecture.EntityPlaced
    fields:
      - {name: placement_id, type: agentic.shared.PlacementId}
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: revision_id, type: agentic.shared.ArchitectureRevisionId}
      - {name: part_id, type: agentic.shared.PartId}
      - {name: part_path, type: agentic.shared.Name}
      - {name: instance, type: Optional<Integer>}
      - {name: entity_name, type: agentic.architecture.EntityName}
      - {name: entity_id, type: Uuid}

commands:
  - name: agentic.architecture.CreateArchitecture
    naming:
      display: Create an architecture
    input:
      - {name: name, type: agentic.shared.Name}
    outcomes:
      - name: created
        creates: agentic.architecture.Architecture
        instance: architecture_id
        sets:
          name: input.name
        emits: [agentic.architecture.ArchitectureCreated]
        payload:
          agentic.architecture.ArchitectureCreated:
            architecture_id: {generated: true}
            name: input.name

  # Declare a part. A new part runs `count` copies, is per no other part, acts for no principal
  # and is off the border. `per` and `acts_for` are set by commands of their own, after the part
  # they name exists.
  # ESS limit: a creating command that guards on another row of its own entity
  # (`when_related: {via: input.per_part_id}` on AddPart) gets no synthesized scenario for any of
  # its outcomes (ESS-SYNTH-003, "no candidate of the 1 tried satisfies a row of Part for
  # input.per_part_id"); the separate commands keep every rule and let synthesis arrange rows.
  - name: agentic.architecture.AddPart
    naming:
      display: Add a part
    input:
      - {name: part_id, type: agentic.shared.PartId}
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: name, type: agentic.shared.Name}
      - {name: kind, type: agentic.architecture.PartKind}
      - {name: count, type: Integer}
      - {name: settings, type: List<agentic.architecture.Setting>}
    outcomes:
      - name: invalid-count
        when: count < 1
        error: agentic.architecture.InvalidCount
      - name: no-such-architecture
        when_related: {via: input.architecture_id, exists: false}
        error: agentic.architecture.NoSuchArchitecture
      - name: retired
        when_related: {via: input.architecture_id, predicate: state == Retired}
        error: agentic.architecture.RetiredArchitecture
      - name: name-taken
        when_related:
          entity: agentic.architecture.Part
          where:
            all:
              - architecture_id == input.architecture_id
              - name == input.name
          exists: true
        error: agentic.architecture.PartNameTaken
      - name: added
        creates: agentic.architecture.Part
        instance: part_id
        sets:
          architecture_id: input.architecture_id
          name: input.name
          kind: input.kind
          count: input.count
          settings: input.settings
          on_border: false
          coordination: None
        emits: [agentic.architecture.PartAdded]
        payload:
          agentic.architecture.PartAdded:
            part_id: input.part_id
            architecture_id: input.architecture_id
            name: input.name
            kind: input.kind
            count: input.count

  # One copy of this part for each copy of another part of the same architecture
  # (`tree: {per: worker}`).
  - name: agentic.architecture.SetPer
    naming:
      display: Run a part once per copy of another
    input:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: part_id, type: agentic.shared.PartId}
      - {name: per_part_id, type: agentic.shared.PartId}
    outcomes:
      - name: self-reference
        when: part_id == per_part_id
        error: agentic.architecture.SelfReference
      - name: no-such-part
        unknown_instance: true
        error: agentic.architecture.NoSuchPart
      - name: foreign-part
        when_subject: {predicate: architecture_id != input.architecture_id}
        error: agentic.architecture.ForeignPart
      - name: no-such-architecture
        when_related: {via: input.architecture_id, exists: false}
        error: agentic.architecture.NoSuchArchitecture
      - name: no-such-per-part
        when_related: {via: input.per_part_id, exists: false}
        error: agentic.architecture.NoSuchPart
      - name: retired
        when_related: {via: input.architecture_id, predicate: state == Retired}
        error: agentic.architecture.RetiredArchitecture
      - name: foreign-per-part
        when_related: {via: input.per_part_id, predicate: architecture_id != input.architecture_id}
        error: agentic.architecture.ForeignPart
      - name: set
        updates: agentic.architecture.Part
        instance: part_id
        sets:
          per_part_id: input.per_part_id
        emits: [agentic.architecture.PartPerSet]
        payload:
          agentic.architecture.PartPerSet:
            part_id: input.part_id
            per_part_id: input.per_part_id

  # An agent part acts for a principal part of the same architecture (`operator: {acts_for:
  # owner}`). Only an agent part acts for anyone, and only for a principal part.
  - name: agentic.architecture.SetActsFor
    naming:
      display: Let an agent part act for a principal part
    input:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: part_id, type: agentic.shared.PartId}
      - {name: principal_part_id, type: agentic.shared.PartId}
    outcomes:
      - name: self-reference
        when: part_id == principal_part_id
        error: agentic.architecture.SelfReference
      - name: no-such-part
        unknown_instance: true
        error: agentic.architecture.NoSuchPart
      - name: foreign-part
        when_subject: {predicate: architecture_id != input.architecture_id}
        error: agentic.architecture.ForeignPart
      - name: not-an-agent
        when_subject: {predicate: kind != Agent}
        error: agentic.architecture.ActsForNeedsAgent
      - name: no-such-architecture
        when_related: {via: input.architecture_id, exists: false}
        error: agentic.architecture.NoSuchArchitecture
      - name: no-such-principal-part
        when_related: {via: input.principal_part_id, exists: false}
        error: agentic.architecture.NoSuchPart
      - name: retired
        when_related: {via: input.architecture_id, predicate: state == Retired}
        error: agentic.architecture.RetiredArchitecture
      - name: foreign-principal-part
        when_related: {via: input.principal_part_id, predicate: architecture_id != input.architecture_id}
        error: agentic.architecture.ForeignPart
      - name: not-a-principal
        when_related: {via: input.principal_part_id, predicate: kind != Principal}
        error: agentic.architecture.ActsForNotPrincipal
      - name: set
        updates: agentic.architecture.Part
        instance: part_id
        sets:
          acts_for_part_id: input.principal_part_id
        emits: [agentic.architecture.AgentActsFor]
        payload:
          agentic.architecture.AgentActsFor:
            part_id: input.part_id
            principal_part_id: input.principal_part_id

  # Allow one part to call or message another. Both ends, and the channel a link travels over,
  # are parts of this architecture. A link carrying questions ends at a part that answers.
  - name: agentic.architecture.AddLink
    naming:
      display: Allow a link
    input:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: from_part_id, type: agentic.shared.PartId}
      - {name: to_part_id, type: agentic.shared.PartId}
      - {name: carries, type: agentic.architecture.Carries}
      - {name: over_part_id, type: Optional<agentic.shared.PartId>}
    outcomes:
      - name: self-link
        when: from_part_id == to_part_id
        error: agentic.architecture.SelfReference
      - name: no-such-architecture
        when_related: {via: input.architecture_id, exists: false}
        error: agentic.architecture.NoSuchArchitecture
      - name: no-such-from-part
        when_related: {via: input.from_part_id, exists: false}
        error: agentic.architecture.NoSuchPart
      - name: no-such-to-part
        when_related: {via: input.to_part_id, exists: false}
        error: agentic.architecture.NoSuchPart
      - name: no-such-channel-part
        when_related: {via: input.over_part_id, exists: false}
        error: agentic.architecture.NoSuchPart
      - name: retired
        when_related: {via: input.architecture_id, predicate: state == Retired}
        error: agentic.architecture.RetiredArchitecture
      - name: foreign-from-part
        when_related: {via: input.from_part_id, predicate: architecture_id != input.architecture_id}
        error: agentic.architecture.ForeignPart
      - name: foreign-to-part
        when_related: {via: input.to_part_id, predicate: architecture_id != input.architecture_id}
        error: agentic.architecture.ForeignPart
      - name: foreign-channel-part
        when_related: {via: input.over_part_id, predicate: architecture_id != input.architecture_id}
        error: agentic.architecture.ForeignPart
      - name: not-a-channel
        when_related: {via: input.over_part_id, predicate: kind != Channel}
        error: agentic.architecture.NotAChannel
      - name: trigger-source-not-trigger
        when_related:
          via: input.from_part_id
          predicate:
            all:
              - input.carries == Trigger
              - kind != Trigger
              - kind != Schedule
        error: agentic.architecture.TriggerSourceNotTrigger
      - name: trigger-target-not-agent
        when_related:
          via: input.to_part_id
          predicate:
            all:
              - input.carries == Trigger
              - kind != Agent
        error: agentic.architecture.TriggerTargetNotAgent
      - name: target-cannot-answer
        when_related:
          via: input.to_part_id
          predicate:
            all:
              - input.carries == Question
              - kind != Principal
              - kind != Agent
        error: agentic.architecture.TargetCannotAnswer
      - name: exists
        when_related:
          entity: agentic.architecture.Link
          where:
            all:
              - from_part_id == input.from_part_id
              - to_part_id == input.to_part_id
              - carries == input.carries
          exists: true
        error: agentic.architecture.LinkExists
      - name: added
        creates: agentic.architecture.Link
        instance: link_id
        sets:
          architecture_id: input.architecture_id
          from_part_id: input.from_part_id
          to_part_id: input.to_part_id
          carries: input.carries
          over_part_id: input.over_part_id
          from_kind: {related: {via: input.from_part_id, field: kind}}
          to_kind: {related: {via: input.to_part_id, field: kind}}
        emits: [agentic.architecture.LinkAdded]
        payload:
          agentic.architecture.LinkAdded:
            link_id: {generated: true}
            architecture_id: input.architecture_id
            from_part_id: input.from_part_id
            to_part_id: input.to_part_id
            carries: input.carries

  # Make an agent part a swarm: how its copies coordinate (an orchestrator, a shared board, a
  # mesh, or not at all) and the time between the starts of two copies. Only an agent part runs
  # copies that coordinate.
  - name: agentic.architecture.SetSwarm
    naming:
      display: Make an agent part a swarm
    input:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: part_id, type: agentic.shared.PartId}
      - {name: coordination, type: agentic.architecture.Coordination}
      - {name: start_stagger, type: Optional<Duration>}
    outcomes:
      - name: no-such-part
        unknown_instance: true
        error: agentic.architecture.NoSuchPart
      - name: no-such-architecture
        when_related: {via: input.architecture_id, exists: false}
        error: agentic.architecture.NoSuchArchitecture
      - name: missing-part
        when_related: {via: input.part_id, exists: false}
        error: agentic.architecture.NoSuchPart
      - name: foreign-part
        when_related: {via: input.part_id, predicate: architecture_id != input.architecture_id}
        error: agentic.architecture.ForeignPart
      - name: retired
        when_related: {via: input.architecture_id, predicate: state == Retired}
        error: agentic.architecture.RetiredArchitecture
      - name: not-an-agent
        when_related: {via: input.part_id, predicate: kind != Agent}
        error: agentic.architecture.SwarmNeedsAgent
      - name: set
        updates: agentic.architecture.Part
        instance: part_id
        sets:
          coordination: input.coordination
          start_stagger: input.start_stagger
        emits: [agentic.architecture.SwarmSet]
        payload:
          agentic.architecture.SwarmSet:
            part_id: input.part_id
            coordination: input.coordination
            start_stagger: input.start_stagger

  # Put a part on the border: a human principal reaches it from outside. In an architecture that
  # has a principal part, only a part a principal part reaches may be on it (no link, no reach): a
  # principal part links to it, or a link carrying Grant ends at it (an authority part holds a
  # principal's grant and permits the part through it). An architecture with no principal part is
  # made to be nested: its border is its interface, which the architecture that nests it links to,
  # so any of its parts may be on the border.
  # UNMAPPED: the design says "what a human reaches"; a principal part carries no principal kind
  # here (human, organization, service). Taken: any principal part's link counts.
  # UNMAPPED: whether the authority part a grant comes from is itself reached by a principal part
  # is not tested: a test over rows holds one level of rows inside it (ESS-COMMAND-009), and a
  # success outcome cannot answer before an error outcome (ESS-COMMAND-004). Taken: any link
  # carrying Grant counts.
  - name: agentic.architecture.SetBorder
    naming:
      display: Put a part on the border
    input:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: part_id, type: agentic.shared.PartId}
    outcomes:
      - name: no-such-part
        unknown_instance: true
        error: agentic.architecture.NoSuchPart
      - name: no-such-architecture
        when_related: {via: input.architecture_id, exists: false}
        error: agentic.architecture.NoSuchArchitecture
      - name: missing-part
        when_related: {via: input.part_id, exists: false}
        error: agentic.architecture.NoSuchPart
      - name: foreign-part
        when_related: {via: input.part_id, predicate: architecture_id != input.architecture_id}
        error: agentic.architecture.ForeignPart
      - name: retired
        when_related: {via: input.architecture_id, predicate: state == Retired}
        error: agentic.architecture.RetiredArchitecture
      - name: not-reached
        when_related:
          entity: agentic.architecture.Part
          where:
            all:
              - part_id == input.part_id
              - exists:
                  in: {entity: agentic.architecture.Part}
                  as: principal
                  that:
                    all:
                      - principal.architecture_id == architecture_id
                      - principal.kind == Principal
              - not:
                  exists:
                    in: {entity: agentic.architecture.Link}
                    as: link
                    that:
                      all:
                        - link.to_part_id == part_id
                        - any: [link.from_kind == Principal, link.carries == Grant]
          exists: true
        error: agentic.architecture.NotReachedByPrincipal
      - name: bordered
        updates: agentic.architecture.Part
        instance: part_id
        sets:
          on_border: true
        emits: [agentic.architecture.PartBordered]
        payload:
          agentic.architecture.PartBordered:
            part_id: input.part_id
            architecture_id: input.architecture_id

  # Freeze the current parts, links and border into a revision. Refused when nothing is declared,
  # when an agent part has no path to a model, when a question has no party that may answer (an
  # agent it goes to acts for no principal and forwards to none, in an architecture that has a
  # principal part), and when a gateway part links to no model.
  - name: agentic.architecture.CommitRevision
    naming:
      display: Commit an architecture revision
    input:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
    outcomes:
      - name: no-such-architecture
        when_related: {via: input.architecture_id, exists: false}
        error: agentic.architecture.NoSuchArchitecture
      - name: retired
        when_related: {via: input.architecture_id, predicate: state == Retired}
        error: agentic.architecture.RetiredArchitecture
      - name: empty
        when_related:
          entity: agentic.architecture.Part
          where: architecture_id == input.architecture_id
          exists: false
        error: agentic.architecture.EmptyArchitecture
      - name: agent-without-model
        when_related:
          entity: agentic.architecture.Part
          where:
            all:
              - architecture_id == input.architecture_id
              - kind == Agent
              - not:
                  exists:
                    in: {entity: agentic.architecture.Link}
                    as: link
                    that:
                      all:
                        - link.from_part_id == part_id
                        - link.carries == ModelCall
                        - any: [link.to_kind == Model, link.to_kind == Gateway]
          exists: true
        error: agentic.architecture.AgentWithoutModel
        # UNMAPPED: the design says a refusal "names the part and the rule". An error payload read
        # from the first offending part (`{related: {entity: Part, where: <the same test>, order_by:
        # [name, part_id], first: name}}`) validates, and the interpreted target answers it
        # ESS-CF-TARGET ("the value source ... of an error is not interpreted yet"), so the error
        # carries no part name here.
      # The agent a question goes to answers it when it acts for a principal part, or when it
      # forwards it: a link of its own carries questions to a principal part. An architecture
      # with no principal part is made to be nested, and its questions leave it through its border.
      - name: question-without-answerer
        when_related:
          entity: agentic.architecture.Link
          where:
            all:
              - architecture_id == input.architecture_id
              - carries == Question
              - to_kind == Agent
              - not:
                  exists:
                    in: {entity: agentic.architecture.Part}
                    as: target
                    that:
                      all:
                        - target.part_id == to_part_id
                        - defined(target.acts_for_part_id)
              - not:
                  exists:
                    in: {entity: agentic.architecture.Link}
                    as: forward
                    that:
                      all:
                        - forward.from_part_id == to_part_id
                        - forward.carries == Question
                        - forward.to_kind == Principal
              - exists:
                  in: {entity: agentic.architecture.Part}
                  as: principal
                  that:
                    all:
                      - principal.architecture_id == architecture_id
                      - principal.kind == Principal
          exists: true
        error: agentic.architecture.QuestionWithoutAnswerer
      # A gateway part passes model calls on, so agent-without-model counts it as a path to a
      # model only because this guard holds: every gateway part links to a model part.
      - name: gateway-without-model
        when_related:
          entity: agentic.architecture.Part
          where:
            all:
              - architecture_id == input.architecture_id
              - kind == Gateway
              - not:
                  exists:
                    in: {entity: agentic.architecture.Link}
                    as: link
                    that:
                      all:
                        - link.from_part_id == part_id
                        - link.carries == ModelCall
                        - link.to_kind == Model
          exists: true
        error: agentic.architecture.GatewayWithoutModel
      - name: committed
        creates: agentic.architecture.ArchitectureRevision
        instance: revision_id
        sets:
          architecture_id: input.architecture_id
          number: {generated: true}
          digest: {generated: true}
        emits: [agentic.architecture.RevisionCommitted]
        payload:
          agentic.architecture.RevisionCommitted:
            revision_id: {generated: true}
            architecture_id: input.architecture_id
            number: {generated: true}
            digest: {generated: true}

  - name: agentic.architecture.RetireArchitecture
    naming:
      display: Retire an architecture
    input:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
    outcomes:
      - name: no-such-architecture
        unknown_instance: true
        error: agentic.architecture.NoSuchArchitecture
      - name: retired
        moves: agentic.architecture.Architecture.retire
        instance: architecture_id
        emits: [agentic.architecture.ArchitectureRetired]
        payload:
          agentic.architecture.ArchitectureRetired:
            architecture_id: input.architecture_id
      - name: wrong-state
        wrong_state: true
        error: agentic.architecture.RetiredArchitecture

  # Record a patch. Its digest is over the rules as written, in order.
  - name: agentic.architecture.RecordPatch
    naming:
      display: Record a patch
    input:
      - {name: name, type: Optional<agentic.shared.Name>}
      - {name: rules, type: List<agentic.architecture.PatchRule>}
    outcomes:
      - name: empty
        when: rules.count == 0
        error: agentic.architecture.EmptyPatch
      - name: recorded
        creates: agentic.architecture.Patch
        instance: patch_id
        sets:
          name: input.name
          rules: input.rules
          digest: {generated: true}
        emits: [agentic.architecture.PatchRecorded]
        payload:
          agentic.architecture.PatchRecorded:
            patch_id: {generated: true}
            digest: {generated: true}

  # Ask for a patch to be applied to an architecture, or tried in a dry run. The applier answers
  # with RecordPatchApplied, RecordDryRunApplied or RecordPatchRefused.
  - name: agentic.architecture.ApplyPatch
    naming:
      display: Apply a patch
    input:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: patch_id, type: agentic.shared.PatchId}
      - {name: dry_run, type: Boolean}
    outcomes:
      - name: no-such-architecture
        when_related: {via: input.architecture_id, exists: false}
        error: agentic.architecture.NoSuchArchitecture
      - name: no-such-patch
        when_related: {via: input.patch_id, exists: false}
        error: agentic.architecture.NoSuchPatch
      - name: retired
        when_related: {via: input.architecture_id, predicate: state == Retired}
        error: agentic.architecture.RetiredArchitecture
      - name: requested
        creates: agentic.architecture.PatchApplication
        instance: application_id
        sets:
          architecture_id: input.architecture_id
          patch_id: input.patch_id
          dry_run: input.dry_run
        emits: [agentic.architecture.PatchRequested]
        payload:
          agentic.architecture.PatchRequested:
            application_id: {generated: true}
            architecture_id: input.architecture_id
            patch_id: input.patch_id
            dry_run: input.dry_run

  # The applier reports that every rule applied and names the revision it committed. A dry run
  # commits none and is reported by RecordDryRunApplied.
  # ESS limit (0.99.2): a `dry-run-commits` refusal (`when_subject: {predicate: dry_run ==
  # true}`, error DryRunCommits) beside `no-such-revision` validates, and synthesis arranges the
  # `no-such-revision` scenario on a dry-run application, where the held-state refusal answers
  # first by the precedence rule; the interpreted target answers `dry-run-commits` and the
  # scenario fails. Until synthesis honours the earlier outcome, the applier keeps that rule.
  - name: agentic.architecture.RecordPatchApplied
    naming:
      display: Record an applied patch
    input:
      - {name: application_id, type: agentic.shared.PatchApplicationId}
      - {name: revision_id, type: agentic.shared.ArchitectureRevisionId}
      - {name: changed_rows, type: Integer}
    outcomes:
      - name: no-such-application
        unknown_instance: true
        error: agentic.architecture.NoSuchPatchApplication
      - name: no-such-revision
        when_related: {via: input.revision_id, exists: false}
        error: agentic.architecture.NoSuchRevision
      - name: applied
        moves: agentic.architecture.PatchApplication.apply
        instance: application_id
        sets:
          revision_id: input.revision_id
          changed_rows: input.changed_rows
        emits: [agentic.architecture.PatchApplied]
        payload:
          agentic.architecture.PatchApplied:
            application_id: input.application_id
            revision_id: input.revision_id
            changed_rows: input.changed_rows
      - name: settled
        wrong_state: true
        error: agentic.architecture.PatchApplicationSettled

  # The applier reports that every rule of a dry run applied; nothing was committed.
  - name: agentic.architecture.RecordDryRunApplied
    naming:
      display: Record an applied dry run
    input:
      - {name: application_id, type: agentic.shared.PatchApplicationId}
      - {name: changed_rows, type: Integer}
    outcomes:
      - name: no-such-application
        unknown_instance: true
        error: agentic.architecture.NoSuchPatchApplication
      - name: not-a-dry-run
        when_subject: {predicate: dry_run == false}
        error: agentic.architecture.AppliedWithoutRevision
      - name: applied
        moves: agentic.architecture.PatchApplication.apply
        instance: application_id
        sets:
          changed_rows: input.changed_rows
        emits: [agentic.architecture.DryRunApplied]
        payload:
          agentic.architecture.DryRunApplied:
            application_id: input.application_id
            changed_rows: input.changed_rows
      - name: settled
        wrong_state: true
        error: agentic.architecture.PatchApplicationSettled

  # The applier reports that a rule, or the check of the whole result, refused; nothing changed.
  - name: agentic.architecture.RecordPatchRefused
    naming:
      display: Record a refused patch
    input:
      - {name: application_id, type: agentic.shared.PatchApplicationId}
      - {name: rule_index, type: Optional<Integer>}
      - {name: error, type: String}
    outcomes:
      - name: invalid-rule-index
        when: rule_index < 1
        error: agentic.architecture.InvalidRuleIndex
      - name: no-such-application
        unknown_instance: true
        error: agentic.architecture.NoSuchPatchApplication
      - name: refused
        moves: agentic.architecture.PatchApplication.refuse
        instance: application_id
        sets:
          rule_index: input.rule_index
          error: input.error
        emits: [agentic.architecture.PatchRefused]
        payload:
          agentic.architecture.PatchRefused:
            application_id: input.application_id
            rule_index: input.rule_index
            error: input.error
      - name: settled
        wrong_state: true
        error: agentic.architecture.PatchApplicationSettled

  # Placements (M45). The runtime records where an entity it created for a part sits: the part of
  # a committed revision, and the copy of the part when it runs several. An entity sits on one
  # copy of a part once per revision; the same entity may sit on another part as well (a gateway
  # two agent parts share). A retired architecture's revisions still run, so retirement refuses no
  # placement.
  # UNMAPPED: a part declared after the revision was committed is not in that revision, and no
  # row says when a part was declared (parts carry no revision). Taken: a part is in a revision
  # when it belongs to the revision's architecture; the runtime places entities only for the parts
  # of the revision it admitted.
  # UNMAPPED: the copies of a part that is `per` another part number the copies of that part,
  # which a chain of `per` can multiply. Taken: the range is checked for a part with a count and
  # no `per` only.
  - name: agentic.architecture.PlaceEntity
    naming:
      display: Place an entity on a part
    input:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: revision_id, type: agentic.shared.ArchitectureRevisionId}
      - {name: part_id, type: agentic.shared.PartId}
      - {name: instance, type: Optional<Integer>}
      - {name: entity_name, type: agentic.architecture.EntityName}
      - {name: entity_id, type: Uuid}
    outcomes:
      - name: invalid-instance
        when:
          all: [defined(instance), instance < 1]
        error: agentic.architecture.InvalidInstance
      - name: no-such-architecture
        when_related: {via: input.architecture_id, exists: false}
        error: agentic.architecture.NoSuchArchitecture
      - name: no-such-revision
        when_related: {via: input.revision_id, exists: false}
        error: agentic.architecture.NoSuchRevision
      - name: no-such-part
        when_related: {via: input.part_id, exists: false}
        error: agentic.architecture.NoSuchPart
      - name: foreign-revision
        when_related: {via: input.revision_id, predicate: architecture_id != input.architecture_id}
        error: agentic.architecture.ForeignRevision
      - name: part-not-in-revision
        when_related: {via: input.part_id, predicate: architecture_id != input.architecture_id}
        error: agentic.architecture.PartNotInRevision
      - name: instance-without-copies
        when_related:
          via: input.part_id
          predicate:
            all:
              - defined(input.instance)
              - count == 1
              - not defined(per_part_id)
        error: agentic.architecture.InstanceWithoutCopies
      - name: instance-out-of-range
        when_related:
          via: input.part_id
          predicate:
            all:
              - defined(input.instance)
              - count > 1
              - not defined(per_part_id)
              - input.instance > count
        error: agentic.architecture.InstanceOutOfRange
      - name: exists
        when_related:
          entity: agentic.architecture.Placement
          where:
            all:
              - revision_id == input.revision_id
              - part_id == input.part_id
              - entity_name == input.entity_name
              - entity_id == input.entity_id
          exists: true
        error: agentic.architecture.PlacementExists
      - name: placed
        creates: agentic.architecture.Placement
        instance: placement_id
        sets:
          architecture_id: input.architecture_id
          revision_id: input.revision_id
          part_id: input.part_id
          part_path: {related: {via: input.part_id, field: name}}
          instance: input.instance
          entity_name: input.entity_name
          entity_id: input.entity_id
        emits: [agentic.architecture.EntityPlaced]
        payload:
          agentic.architecture.EntityPlaced:
            placement_id: {generated: true}
            architecture_id: input.architecture_id
            revision_id: input.revision_id
            part_id: input.part_id
            part_path: {related: {via: input.part_id, field: name}}
            instance: input.instance
            entity_name: input.entity_name
            entity_id: input.entity_id

  # Record one port the derivation found in the blocks.
  - name: agentic.architecture.DeclarePort
    naming:
      display: Declare a port
    input:
      - {name: name, type: agentic.shared.Name}
      - {name: block, type: agentic.shared.Name}
      - {name: kind, type: agentic.architecture.PortKind}
      - {name: intent_event, type: Optional<agentic.architecture.EventName>}
      - {name: waiting_state, type: Optional<agentic.architecture.StateName>}
      - {name: reports, type: List<agentic.architecture.CommandName>}
      - {name: protocol, type: agentic.architecture.Protocol}
    outcomes:
      - name: name-taken
        when_related:
          entity: agentic.architecture.Port
          where: name == input.name
          exists: true
        error: agentic.architecture.PortNameTaken
      - name: declared
        creates: agentic.architecture.Port
        instance: port_id
        sets:
          name: input.name
          block: input.block
          kind: input.kind
          intent_event: input.intent_event
          waiting_state: input.waiting_state
          reports: input.reports
          protocol: input.protocol
        emits: [agentic.architecture.PortDeclared]
        payload:
          agentic.architecture.PortDeclared:
            port_id: {generated: true}
            name: input.name
            block: input.block

  # Record the contract derived from one revision. Its digest is over the ports, invariants and
  # border as recorded.
  - name: agentic.architecture.RecordContract
    naming:
      display: Record the contract of a revision
    input:
      - {name: revision_id, type: agentic.shared.ArchitectureRevisionId}
      - {name: ports, type: List<agentic.architecture.ContractPort>}
      - {name: invariants, type: List<agentic.architecture.RoutingInvariant>}
      - {name: border, type: List<agentic.shared.PartId>}
      - {name: ingress, type: List<agentic.architecture.ContractIngress>}
    outcomes:
      - name: empty
        when: ports.count == 0
        error: agentic.architecture.EmptyContract
      - name: no-such-revision
        when_related: {via: input.revision_id, exists: false}
        error: agentic.architecture.NoSuchRevision
      - name: contract-exists
        when_related:
          entity: agentic.architecture.Contract
          where: revision_id == input.revision_id
          exists: true
        error: agentic.architecture.ContractExists
      - name: recorded
        creates: agentic.architecture.Contract
        instance: contract_id
        sets:
          revision_id: input.revision_id
          digest: {generated: true}
          ports: input.ports
          invariants: input.invariants
          border: input.border
          ingress: input.ingress
        emits: [agentic.architecture.ContractRecorded]
        payload:
          agentic.architecture.ContractRecorded:
            contract_id: {generated: true}
            revision_id: input.revision_id
            digest: {generated: true}

  # Declare an ingress of an architecture: its name, its audience (a principal part of the same
  # architecture), whether callers authenticate, and its interface's rules as written. The
  # document's check (`agenticspec sim check`) holds the rules an ingress's interface and exports
  # must keep together; this command keeps the rules of its own rows.
  - name: agentic.architecture.AddIngress
    naming:
      display: Add an ingress
    input:
      - {name: ingress_id, type: agentic.shared.IngressId}
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: name, type: agentic.shared.Name}
      - {name: audience_part_id, type: agentic.shared.PartId}
      - {name: authenticated, type: Boolean}
      - {name: interface, type: String}
    outcomes:
      - name: no-such-architecture
        when_related: {via: input.architecture_id, exists: false}
        error: agentic.architecture.NoSuchArchitecture
      - name: no-such-audience
        when_related: {via: input.audience_part_id, exists: false}
        error: agentic.architecture.NoSuchPart
      - name: retired
        when_related: {via: input.architecture_id, predicate: state == Retired}
        error: agentic.architecture.RetiredArchitecture
      - name: foreign-audience
        when_related: {via: input.audience_part_id, predicate: architecture_id != input.architecture_id}
        error: agentic.architecture.ForeignPart
      - name: audience-not-principal
        when_related: {via: input.audience_part_id, predicate: kind != Principal}
        error: agentic.architecture.AudienceNotPrincipal
      - name: name-taken
        when_related:
          entity: agentic.architecture.Ingress
          where:
            all:
              - architecture_id == input.architecture_id
              - name == input.name
          exists: true
        error: agentic.architecture.IngressNameTaken
      - name: added
        creates: agentic.architecture.Ingress
        instance: ingress_id
        sets:
          architecture_id: input.architecture_id
          name: input.name
          audience_part_id: input.audience_part_id
          authenticated: input.authenticated
          interface: input.interface
        emits: [agentic.architecture.IngressAdded]
        payload:
          agentic.architecture.IngressAdded:
            ingress_id: input.ingress_id
            architecture_id: input.architecture_id
            name: input.name
            audience_part_id: input.audience_part_id

  # Export an ingress over one protocol; each protocol at most once per ingress.
  - name: agentic.architecture.AddExport
    naming:
      display: Export an ingress over a protocol
    input:
      - {name: export_id, type: agentic.shared.ExportId}
      - {name: ingress_id, type: agentic.shared.IngressId}
      - {name: protocol, type: agentic.architecture.ExportProtocol}
    outcomes:
      - name: no-such-ingress
        when_related: {via: input.ingress_id, exists: false}
        error: agentic.architecture.NoSuchIngress
      - name: exists
        when_related:
          entity: agentic.architecture.Export
          where:
            all:
              - ingress_id == input.ingress_id
              - protocol == input.protocol
          exists: true
        error: agentic.architecture.ExportExists
      - name: added
        creates: agentic.architecture.Export
        instance: export_id
        sets:
          ingress_id: input.ingress_id
          protocol: input.protocol
        emits: [agentic.architecture.ExportAdded]
        payload:
          agentic.architecture.ExportAdded:
            export_id: input.export_id
            ingress_id: input.ingress_id
            protocol: input.protocol

views:
  # Who may call whom: one row per link. No row, no reach.
  - name: agentic.architecture.Reach
    source: agentic.architecture.Link
    consistency: read_your_writes
    params:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
    filter: architecture_id == param.architecture_id
    fields:
      - {name: link_id, type: agentic.shared.LinkId}
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: from_part_id, type: agentic.shared.PartId}
      - name: from_name
        type: Optional<agentic.shared.Name>
        field: {related: {via: from_part_id, field: name}}
      - {name: to_part_id, type: agentic.shared.PartId}
      - name: to_name
        type: Optional<agentic.shared.Name>
        field: {related: {via: to_part_id, field: name}}
      - {name: carries, type: agentic.architecture.Carries}
      - {name: over_part_id, type: Optional<agentic.shared.PartId>}
      - {name: from_kind, type: agentic.architecture.PartKind}
      - {name: to_kind, type: agentic.architecture.PartKind}

  - name: agentic.architecture.Parts
    source: agentic.architecture.Part
    consistency: read_your_writes
    fields:
      - {name: part_id, type: agentic.shared.PartId}
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: name, type: agentic.shared.Name}
      - {name: kind, type: agentic.architecture.PartKind}
      - {name: count, type: Integer}
      - {name: per_part_id, type: Optional<agentic.shared.PartId>}
      - {name: acts_for_part_id, type: Optional<agentic.shared.PartId>}
      - {name: settings, type: List<agentic.architecture.Setting>}
      - {name: on_border, type: Boolean}
      - {name: coordination, type: agentic.architecture.Coordination}
      - {name: start_stagger, type: Optional<Duration>}

  - name: agentic.architecture.Revisions
    source: agentic.architecture.ArchitectureRevision
    consistency: read_your_writes
    fields:
      - {name: revision_id, type: agentic.shared.ArchitectureRevisionId}
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: number, type: Integer}
      - {name: digest, type: agentic.architecture.Digest}

  - name: agentic.architecture.Architectures
    source: agentic.architecture.Architecture
    consistency: read_your_writes
    fields:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: name, type: agentic.shared.Name}
      - {name: state, type: agentic.architecture.Architecture.State}

  - name: agentic.architecture.Patches
    source: agentic.architecture.Patch
    consistency: read_your_writes
    fields:
      - {name: patch_id, type: agentic.shared.PatchId}
      - {name: name, type: Optional<agentic.shared.Name>}
      - {name: rules, type: List<agentic.architecture.PatchRule>}
      - {name: digest, type: agentic.architecture.Digest}

  # The patch history of one architecture: undo, drafts and comparisons read it.
  - name: agentic.architecture.PatchApplications
    source: agentic.architecture.PatchApplication
    consistency: read_your_writes
    params:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
    filter: architecture_id == param.architecture_id
    fields:
      - {name: application_id, type: agentic.shared.PatchApplicationId}
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: patch_id, type: agentic.shared.PatchId}
      - {name: dry_run, type: Boolean}
      - {name: revision_id, type: Optional<agentic.shared.ArchitectureRevisionId>}
      - {name: changed_rows, type: Optional<Integer>}
      - {name: rule_index, type: Optional<Integer>}
      - {name: error, type: Optional<String>}
      - {name: state, type: agentic.architecture.PatchApplication.State}

  # Placements (M45). The placements of one architecture, narrowed to one part path, one copy and
  # one entity name when the read names them. The runtime reads it to answer a read scoped to a
  # part under the scope rule written at the entity Placement.
  - name: agentic.architecture.Placements
    source: agentic.architecture.Placement
    consistency: read_your_writes
    params:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: part_path, type: Optional<agentic.shared.Name>}
      - {name: instance, type: Optional<Integer>}
      - {name: entity_name, type: Optional<agentic.architecture.EntityName>}
    filter:
      all:
        - architecture_id == param.architecture_id
        - any: [not defined(param.part_path), part_path == param.part_path]
        - any: [not defined(param.instance), instance == param.instance]
        - any: [not defined(param.entity_name), entity_name == param.entity_name]
    fields:
      - {name: placement_id, type: agentic.shared.PlacementId}
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: revision_id, type: agentic.shared.ArchitectureRevisionId}
      - {name: part_id, type: agentic.shared.PartId}
      - {name: part_path, type: agentic.shared.Name}
      - {name: instance, type: Optional<Integer>}
      - {name: entity_name, type: agentic.architecture.EntityName}
      - {name: entity_id, type: Uuid}

  # The marked ports of the blocks: what a runtime may have to implement.
  - name: agentic.architecture.Ports
    source: agentic.architecture.Port
    consistency: read_your_writes
    fields:
      - {name: port_id, type: agentic.shared.PortId}
      - {name: name, type: agentic.shared.Name}
      - {name: block, type: agentic.shared.Name}
      - {name: kind, type: agentic.architecture.PortKind}
      - {name: intent_event, type: Optional<agentic.architecture.EventName>}
      - {name: waiting_state, type: Optional<agentic.architecture.StateName>}
      - {name: reports, type: List<agentic.architecture.CommandName>}
      - {name: protocol, type: agentic.architecture.Protocol}

  # The contract of one revision: what a runtime must provide to run it.
  - name: agentic.architecture.Contracts
    source: agentic.architecture.Contract
    consistency: read_your_writes
    params:
      - {name: revision_id, type: agentic.shared.ArchitectureRevisionId}
    filter: revision_id == param.revision_id
    fields:
      - {name: contract_id, type: agentic.shared.ContractId}
      - {name: revision_id, type: agentic.shared.ArchitectureRevisionId}
      - {name: digest, type: agentic.architecture.Digest}
      - {name: ports, type: List<agentic.architecture.ContractPort>}
      - {name: invariants, type: List<agentic.architecture.RoutingInvariant>}
      - {name: border, type: List<agentic.shared.PartId>}
      - {name: ingress, type: List<agentic.architecture.ContractIngress>}

  # The ingresses of one architecture: who reaches it from outside, and under which rules.
  - name: agentic.architecture.Ingresses
    source: agentic.architecture.Ingress
    consistency: read_your_writes
    params:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
    filter: architecture_id == param.architecture_id
    fields:
      - {name: ingress_id, type: agentic.shared.IngressId}
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: name, type: agentic.shared.Name}
      - {name: audience_part_id, type: agentic.shared.PartId}
      - name: audience_name
        type: Optional<agentic.shared.Name>
        field: {related: {via: audience_part_id, field: name}}
      - {name: authenticated, type: Boolean}
      - {name: interface, type: String}
