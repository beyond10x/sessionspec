      - {name: expires_at, type: Timestamp}
      - {name: granted_by, type: agentic.shared.PrincipalId}
      - {name: granted_at, type: Timestamp}
      - {name: effect, type: agentic.shared.Verdict}
      - {name: condition, type: "Optional<String>"}
      - {name: excludes, type: "List<agentic.shared.Name>"}
      - {name: supersedes, type: "Optional<agentic.shared.GrantId>"}
      - {name: state, type: agentic.authority.Grant.State}
    naming:
      wire: grants
      display: Grants

  - name: agentic.authority.Budgets
