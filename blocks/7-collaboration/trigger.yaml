      - {name: failure, type: String}

views:
  - name: agentic.trigger.Triggers
    source: agentic.trigger.Trigger
    consistency: read_your_writes
    fields:
      - {name: trigger_id, type: agentic.shared.TriggerId}
      - {name: kind, type: agentic.trigger.TriggerKind}
      - {name: subscription_id, type: Optional<agentic.shared.SubscriptionId>}
      - {name: schedule_id, type: Optional<agentic.shared.ScheduleId>}
      - {name: event_name, type: Optional<String>}
      - {name: agent_revision_id, type: agentic.shared.AgentRevisionId}
      - {name: task_template, type: Optional<String>}
      - {name: policy, type: agentic.trigger.ConcurrencyPolicy}
      - {name: max_parallel, type: Integer}
      - {name: running, type: Integer}
      - {name: condition, type: Optional<String>}
      - {name: process_id, type: Optional<agentic.shared.ProcessId>}
      - {name: intake, type: Optional<String>}
      - {name: start_mode, type: Optional<agentic.trigger.StartMode>}
      - {name: subject_policy, type: Optional<agentic.trigger.SubjectPolicy>}
      - {name: state, type: agentic.trigger.Trigger.State}

  - name: agentic.trigger.TriggersOfRevision
    source: agentic.trigger.Trigger
    consistency: read_your_writes
    params:
      - {name: agent_revision_id, type: agentic.shared.AgentRevisionId}
    filter: agent_revision_id == param.agent_revision_id
    fields:
      - {name: trigger_id, type: agentic.shared.TriggerId}
      - {name: kind, type: agentic.trigger.TriggerKind}
      - {name: policy, type: agentic.trigger.ConcurrencyPolicy}
      - {name: max_parallel, type: Integer}
      - {name: running, type: Integer}
      - {name: state, type: agentic.trigger.Trigger.State}

  - name: agentic.trigger.Schedules
    source: agentic.trigger.Schedule
    consistency: read_your_writes
    fields:
      - {name: schedule_id, type: agentic.shared.ScheduleId}
      - {name: expression, type: String}
      - {name: timezone, type: String}
      - {name: next_fire_at, type: Timestamp}
      - {name: checks_passed_at, type: Optional<Timestamp>}
      - {name: state, type: agentic.trigger.Schedule.State}

  - name: agentic.trigger.Firings
    source: agentic.trigger.Firing
    consistency: read_your_writes
    fields:
      - {name: firing_id, type: agentic.shared.FiringId}
      - {name: trigger_id, type: agentic.shared.TriggerId}
      - {name: fired_at, type: Timestamp}
      - {name: post_id, type: Optional<agentic.shared.PostId>}
      - {name: tick, type: Optional<Timestamp>}
      - {name: run_id, type: Optional<agentic.shared.RunId>}
      - {name: harness_session_id, type: Optional<agentic.shared.HarnessSessionId>}
      - {name: started_at, type: Optional<Timestamp>}
      - {name: ended_at, type: Optional<Timestamp>}
      - {name: failure, type: Optional<String>}
      - {name: subject_key, type: Optional<String>}
      - {name: state, type: agentic.trigger.Firing.State}

  # The firings of one trigger with the time each fired; a reader orders them by fired_at.
  - name: agentic.trigger.RecentFirings
    source: agentic.trigger.Firing
    consistency: read_your_writes
    params:
      - {name: trigger_id, type: agentic.shared.TriggerId}
    filter: trigger_id == param.trigger_id
    fields:
      - {name: firing_id, type: agentic.shared.FiringId}
      - {name: fired_at, type: Timestamp}
      - {name: post_id, type: Optional<agentic.shared.PostId>}
      - {name: tick, type: Optional<Timestamp>}
      - {name: run_id, type: Optional<agentic.shared.RunId>}
      - {name: harness_session_id, type: Optional<agentic.shared.HarnessSessionId>}
      - {name: state, type: agentic.trigger.Firing.State}
