domain: agenticspec.cli

summary: >-
  The typed inputs, results and refusals of the `agenticspec` command line, presented by the
  ess-cli/2 binding in `spec/cli.yaml`. It declares no entity. The KPI report is typed here, so
  every figure the report carries is a declared field.

# ess-cli projects String, Boolean, Integer, enums, newtypes and structs, Optional, List, Map and Json
# in results only. A ratio is an Integer in permille; a time is RFC 3339 text.

types:
  - name: agenticspec.cli.Refusal
    kind: struct
    fields:
      - name: detail
        type: String

  - name: agenticspec.cli.LiftInput
    kind: struct
    fields:
      - name: transcript
        type: String
        summary: The main transcript file of one Claude Code session, `<session>.jsonl`; its sub-agents are read from `<session>/subagents/`.

  - name: agenticspec.cli.LiftedCommand
    kind: struct
    naming:
      summary: One command of the lifted session, as replayed, with the outcome the session IR answered.
    fields:
      - name: seq
        type: Integer
      - name: at
        type: String
      - name: actor
        type: String
      - name: command
        type: String
      - name: outcome
        type: String
      - name: input
        type: Json

  - name: agenticspec.cli.LiftResult
    kind: struct
    fields:
      - name: session_id
        type: String
      - name: agents
        type: Integer
      - name: commands
        type: List<agenticspec.cli.LiftedCommand>
      - name: refused
        type: Integer
        summary: Commands the session IR answered with a declared refusal (a wrong state, an unknown agent).

  - name: agenticspec.cli.KpiInput
    kind: struct
    fields:
      - name: root
        type: Optional<String>
        summary: The Claude Code projects directory; `~/.claude/projects` by default.
      - name: since_hours
        type: Optional<Integer>
        summary: The window ends now and starts this many hours before; 72 by default.

  - name: agenticspec.cli.AgentScope
    kind: enum
    variants: [main, sub]

  - name: agenticspec.cli.BustCause
    kind: enum
    variants: [ttl_expired, model_changed, compacted, unexplained]

  - name: agenticspec.cli.ModelFigures
    kind: struct
    fields:
      - {name: scope, type: agenticspec.cli.AgentScope}
      - {name: model, type: String}
      - {name: messages, type: Integer}
      - {name: output_tokens, type: Integer}
      - {name: context_p50, type: Integer}
      - {name: context_p90, type: Integer}
      - {name: context_max, type: Integer}
      - name: cost_microdollars
        type: Integer
        summary: The tokens of these messages at the API list price of the model (src/pricing.rs), in millionths of a dollar; 0 for a model with no price.

  - name: agenticspec.cli.CacheFigures
    kind: struct
    fields:
      - {name: scope, type: agenticspec.cli.AgentScope}
      - {name: read_tokens, type: Integer}
      - {name: write_tokens, type: Integer}
      - {name: uncached_tokens, type: Integer}
      - {name: hit_permille, type: Integer}

  - name: agenticspec.cli.BustFigures
    kind: struct
    fields:
      - {name: scope, type: agenticspec.cli.AgentScope}
      - {name: cause, type: agenticspec.cli.BustCause}
      - {name: count, type: Integer}
      - {name: tokens_written_again, type: Integer}

  - name: agenticspec.cli.ConcurrencyFigures
    kind: struct
    naming:
      summary: Agents active in the same minute; active means two of its records at most 5 minutes apart around the minute.
    fields:
      - {name: scope, type: agenticspec.cli.AgentScope}
      - {name: p50, type: Integer}
      - {name: p90, type: Integer}
      - {name: max, type: Integer}

  - name: agenticspec.cli.PromptFigures
    kind: struct
    fields:
      - {name: author, type: agenticspec.session.PromptAuthor}
      - {name: attribution, type: agenticspec.session.Attribution}
      - {name: count, type: Integer}

  - name: agenticspec.cli.DecisionFigures
    kind: struct
    fields:
      - {name: decider, type: agenticspec.session.Decider}
      - {name: decision, type: agenticspec.session.Decision}
      - {name: count, type: Integer}

  - name: agenticspec.cli.AutonomyFigures
    kind: struct
    naming:
      summary: >-
        Prompts and decisions of main agents. Working is time in which at least one agent of the
        session was Working (gaps up to 10 minutes). Waiting on the human is time in which no agent
        was Working, from a main agent's turn end to its next Human or Delegate prompt; over one
        hour it counts as away.
    fields:
      - {name: working_seconds, type: Integer}
      - {name: waiting_on_human_seconds, type: Integer}
      - {name: away_seconds, type: Integer}
      - {name: prompts, type: List<agenticspec.cli.PromptFigures>}
      - {name: decisions, type: List<agenticspec.cli.DecisionFigures>}

  - name: agenticspec.cli.ExposureFigures
    kind: struct
    fields:
      - {name: channel, type: agenticspec.session.ExposureChannel}
      - {name: class, type: agenticspec.session.ExposureClass}
      - {name: kind, type: String}
      - {name: verdict, type: agenticspec.session.Verdict}
      - {name: count, type: Integer}
      - {name: sessions, type: Integer}

  - name: agenticspec.cli.KpiReport
    kind: struct
    fields:
      - {name: window_from, type: String}
      - {name: window_to, type: String}
      - {name: transcripts, type: Integer}
      - {name: sessions, type: Integer}
      - {name: sub_agents, type: Integer}
      - {name: refused_commands, type: Integer}
      - name: cost_microdollars
        type: Integer
        summary: The sum of the model figures, at API list price; a subscription bills otherwise.
      - name: unpriced_messages
        type: Integer
        summary: Model messages of a model with no price in src/pricing.rs, not in the cost.
      - {name: models, type: List<agenticspec.cli.ModelFigures>}
      - {name: cache, type: List<agenticspec.cli.CacheFigures>}
      - {name: busts, type: List<agenticspec.cli.BustFigures>}
      - {name: concurrency, type: List<agenticspec.cli.ConcurrencyFigures>}
      - {name: autonomy, type: agenticspec.cli.AutonomyFigures}
      - {name: exposures, type: List<agenticspec.cli.ExposureFigures>}

  - name: agenticspec.cli.AnalyzeInput
    kind: struct
    fields:
      - name: root
        type: Optional<String>
        summary: The Claude Code projects directory; `~/.claude/projects` by default.
      - name: since_hours
        type: Optional<Integer>
        summary: The window ends now and starts this many hours before; 72 by default.
      - name: out
        type: Optional<String>
        summary: The dashboard file to write; `agenticspec-dashboard.html` beside the store (in the state directory) by default.

  - name: agenticspec.cli.AnalyzeResult
    kind: struct
    fields:
      - {name: path, type: String}
      - {name: sessions, type: Integer}

  - name: agenticspec.cli.ToolFigures
    kind: struct
    fields:
      - {name: category, type: agenticspec.session.ToolCategory}
      - {name: calls, type: Integer}
      - {name: refused, type: Integer}
      - {name: failed, type: Integer}

  - name: agenticspec.cli.MarkKind
    kind: enum
    variants: [turn, human_prompt, delegate_prompt, peer_prompt, harness_prompt, compaction, cache_bust, refusal]

  - name: agenticspec.cli.TimelineMark
    kind: struct
    naming:
      summary: One point of a session's timeline. For a turn the value is the context size, for a cache bust the tokens written again, otherwise 0.
    fields:
      - {name: at, type: String}
      - {name: kind, type: agenticspec.cli.MarkKind}
      - {name: scope, type: agenticspec.cli.AgentScope}
      - {name: value, type: Integer}

  - name: agenticspec.cli.SessionSummary
    kind: struct
    naming:
      summary: One session with its own KPI report. The title is the harness's title of the session and is shown only on the host that holds the transcript.
    fields:
      - {name: session_id, type: String}
      - {name: project, type: String}
      - {name: title, type: Optional<String>}
      - {name: first_at, type: String}
      - {name: last_at, type: String}
      - {name: kpis, type: agenticspec.cli.KpiReport}
      - {name: tools, type: List<agenticspec.cli.ToolFigures>}
      - {name: timeline, type: List<agenticspec.cli.TimelineMark>}

  - name: agenticspec.cli.QueryInput
    kind: struct
    naming:
      summary: An sq module, from a file or inline text, run over one session or over the sessions of a window.
    fields:
      - name: module
        type: Optional<String>
        summary: An `.sq` file of rules, queries and checks.
      - name: text
        type: Optional<String>
        summary: sq text given inline; appended to the module when both are given.
      - name: transcript
        type: Optional<String>
        summary: One main transcript; the window is not read when it is given.
      - name: root
        type: Optional<String>
        summary: The Claude Code projects directory; `~/.claude/projects` by default.
      - name: since_hours
        type: Optional<Integer>
        summary: The window ends now and starts this many hours before; 72 by default.

  - name: agenticspec.cli.Certainty
    kind: enum
    variants: [definite, possible]

  - name: agenticspec.cli.QueryRow
    kind: struct
    naming:
      summary: One answer of a query. Possible when it rests on an inferred or missing fact; unknown names each such fact.
    fields:
      - {name: query, type: Integer}
      - {name: session_id, type: String}
      - {name: values, type: List<String>}
      - {name: certainty, type: agenticspec.cli.Certainty}
      - {name: unknown, type: List<String>}

  - name: agenticspec.cli.CheckVerdict
    kind: struct
    fields:
      - {name: check, type: String}
      - {name: session_id, type: String}
      - {name: verdict, type: agenticspec.session.Verdict}
      - {name: rows, type: Integer}

  - name: agenticspec.cli.CheckFigures
    kind: struct
    fields:
      - {name: check, type: String}
      - {name: about, type: String}
      - {name: severity, type: String}
      - {name: ok, type: Integer}
      - {name: gap, type: Integer}
      - {name: unk, type: Integer}

  - name: agenticspec.cli.QueryReport
    kind: struct
    naming:
      summary: The report of `agenticspec query`, format `agenticspec-query-report/1`.
    fields:
      - {name: format, type: String}
      - {name: sessions, type: Integer}
      - {name: queries, type: List<String>}
      - {name: rows, type: List<agenticspec.cli.QueryRow>}
      - {name: checks, type: List<agenticspec.cli.CheckFigures>}
      - {name: verdicts, type: List<agenticspec.cli.CheckVerdict>}

  - name: agenticspec.cli.MineInput
    kind: struct
    fields:
      - name: root
        type: Optional<String>
        summary: The Claude Code projects directory; `~/.claude/projects` by default.
      - name: since_hours
        type: Optional<Integer>
        summary: The window ends now and starts this many hours before; 72 by default.
      - name: level
        type: Optional<String>
        summary: The token alphabet, `coarse` (tool category) or `tool` (tool name, a shell call by its dominant shellspec category); `tool` by default.
      - name: min_sessions
        type: Optional<Integer>
        summary: A pattern is kept when it occurs in at least this many sessions; 5 by default.
      - name: min_projects
        type: Optional<Integer>
        summary: … and in at least this many projects; 2 by default.
      - name: top
        type: Optional<Integer>
        summary: The number of patterns reported, by support; 50 by default.

  - name: agenticspec.cli.Pattern
    kind: struct
    naming:
      summary: >-
        A run of tokens that recurs in the turns of agents across sessions. Support counts distinct
        sessions, not occurrences. The query is the sq text that finds the pattern again.
    fields:
      - {name: id, type: String}
      - {name: tokens, type: List<String>}
      - {name: sessions, type: Integer}
      - {name: projects, type: Integer}
      - {name: occurrences, type: Integer}
      - {name: ok_permille, type: Integer}
      - {name: query, type: String}

  - name: agenticspec.cli.MineReport
    kind: struct
    naming:
      summary: The report of `agenticspec mine`, format `agenticspec-patterns/1`.
    fields:
      - {name: format, type: String}
      - {name: level, type: String}
      - {name: sessions, type: Integer}
      - {name: turns, type: Integer}
      - {name: patterns, type: List<agenticspec.cli.Pattern>}

  - name: agenticspec.cli.ProcedureInput
    kind: struct
    fields:
      - name: pattern
        type: String
        summary: The tokens of a mined pattern, space-separated, or its id from a report of `agenticspec mine`.
      - name: root
        type: Optional<String>
      - name: since_hours
        type: Optional<Integer>
      - name: level
        type: Optional<String>
      - name: out
        type: Optional<String>
        summary: The file the procedure is written to; printed only by default.

  - name: agenticspec.cli.StepKind
    kind: enum
    variants: [program, judgement, person, child]

  - name: agenticspec.cli.ProcedureParameter
    kind: struct
    naming:
      summary: A value that varies across the matches of a pattern. Values are kept only when they are not content (a tool name, a category, a count), never a path or a command.
    fields:
      - {name: name, type: String}
      - {name: step, type: String}
      - {name: kind, type: String}
      - {name: values, type: List<String>}

  - name: agenticspec.cli.ProcedureStep
    kind: struct
    fields:
      - {name: id, type: String}
      - {name: kind, type: agenticspec.cli.StepKind}
      - {name: token, type: String}
      - {name: tool, type: String}
      - {name: category, type: String}
      - name: shape
        type: Optional<String>
        summary: The shellspec shape of a shell step when every match agrees; no values.
      - name: effect
        type: String
        summary: read, write, external or none.
      - {name: after, type: List<String>}
      - name: retry_max
        type: Integer
        summary: The most times the step ran again in one match after it failed.
      - name: timeout_seconds
        type: Integer
        summary: The longest observed duration of the step, rounded up to a minute.
      - {name: ok_permille, type: Integer}

  - name: agenticspec.cli.Procedure
    kind: struct
    naming:
      summary: >-
        A mined pattern lifted into a procedure, format `agenticspec-procedure/1`: steps, the
        parameters that vary across matches, and the sessions it came from. A draft until a person
        promotes it.
    fields:
      - {name: format, type: String}
      - {name: id, type: String}
      - {name: description, type: String}
      - {name: pattern, type: List<String>}
      - {name: matches, type: Integer}
      - {name: sessions, type: List<String>}
      - {name: parameters, type: List<agenticspec.cli.ProcedureParameter>}
      - {name: steps, type: List<agenticspec.cli.ProcedureStep>}
      - {name: query, type: String}

  - name: agenticspec.cli.ExportInput
    kind: struct
    fields:
      - name: procedure
        type: String
        summary: A `agenticspec-procedure/1` file.
      - name: out
        type: String
        summary: The directory the protocol and the bindings are written to.

  - name: agenticspec.cli.ExportResult
    kind: struct
    fields:
      - {name: protocol, type: String}
      - {name: bindings, type: String}
      - name: validated
        type: Boolean
        summary: canon accepted the protocol; false when canon refused it or is not installed.
      - {name: detail, type: String}

  - name: agenticspec.cli.Dashboard
    kind: struct
    naming:
      summary: What the dashboard file embeds.
    fields:
      - {name: generated_at, type: String}
      - {name: overall, type: agenticspec.cli.KpiReport}
      - {name: sessions, type: List<agenticspec.cli.SessionSummary>}

  - name: agenticspec.cli.SyncInput
    kind: struct
    fields:
      - name: root
        type: Optional<String>
        summary: The Claude Code projects directory; `~/.claude/projects` by default.
      - name: since_hours
        type: Optional<Integer>
        summary: Main transcripts with a file modified in this many hours before now; 72 by default.

  - name: agenticspec.cli.SyncResult
    kind: struct
    naming:
      summary: >-
        One pass of the store over the transcripts of a window. A main transcript whose own file
        and sub-agent files keep their size and modification time is `unchanged`; every other one
        is lifted, redacted and written again in one transaction.
    fields:
      - name: db
        type: String
        summary: The store, `<state-dir>/sessions.db`.
      - {name: scanned, type: Integer}
      - {name: lifted, type: Integer}
      - {name: unchanged, type: Integer}
      - {name: failed, type: Integer}
      - name: sessions
        type: Integer
        summary: Sessions the store holds after the pass, of every window.
      - {name: ms, type: Integer}

  - name: agenticspec.cli.ServeInput
    kind: struct
    fields:
      - name: root
        type: Optional<String>
      - name: since_hours
        type: Optional<Integer>
        summary: The window the server keeps in sync every 5 seconds; 72 by default.
      - name: port
        type: Optional<Integer>
        summary: The local port; 7420 by default. The server listens on 127.0.0.1 only.

  - name: agenticspec.cli.ServeResult
    kind: struct
    fields:
      - {name: url, type: String}

  - name: agenticspec.cli.SimCheckInput
    kind: struct
    fields:
      - name: architecture
        type: String
        summary: An `agenticspec-architecture/1` file.
      - name: ports
        type: Optional<String>
        summary: The ports file (`agenticspec-ports/1`) a document with `ingress:` is checked against; `blocks/ports.json` by default.
      - name: kpis
        type: Optional<String>
        summary: The KPI catalogue (`agenticspec-kpis/1`) a document with `ingress:` or `requirements:` is checked against; `kpis/catalogue.yaml` by default.
      - name: json
        type: Boolean
        summary: >-
          Print the `agenticspec-check/1` document on standard output, also when the check
          refuses the architecture.

  - name: agenticspec.cli.SimCheckResult
    kind: struct
    naming:
      summary: >-
        The architecture the check accepted, with its counts of parts, links and ingresses, the KPIs
        of the architecture as a whole, the architectures it nests and its requirements, each met,
        missed or undecided. With `--json`, the
        `agenticspec-check/1` document, which carries `format`, `valid`, `violations` and `counts`
        too; a refused architecture prints the document of the check alone before its refusal.
    fields:
      - {name: architecture, type: String}
      - {name: parts, type: Integer}
      - {name: links, type: Integer}
      - name: kpis
        type: Json
        summary: >-
          The KPIs of the architecture as a whole, read from the document alone, by id: an object
          of numbers, the KPIs `block: architecture` of the KPI catalogue that are not gates
          (`agents_total`, `capacity_ratio`, ...). A marked place counts at its value as built.
      - name: single_points
        type: List<String>
        summary: The parts whose removal leaves some agent with no model_call path to a model, the parts `kpis.single_points` counts.
      - name: nested
        type: List<agenticspec.cli.SimNested>
        summary: Every nested architecture, resolved recursively, outermost first; empty when it nests none.
      - {name: ingresses, type: Integer}
      - name: requirements
        type: Json
        summary: >-
          Each entry of the document's `requirements:` as written, with its `stage` (`check`,
          `evaluation`, `operation` or `cloud`), its `state` (`met`, `missed` or `undecided`) and the
          `value` it was decided on: a KPI of the architecture as a whole or a gate count is decided
          at check, every other one is `undecided`. A missed requirement is reported here and does
          not refuse the document. Empty when the document has none.
      - name: format
        type: Optional<String>
        summary: "`agenticspec-check/1`."
      - name: valid
        type: Optional<Boolean>
        summary: No violation of a gate rule.
      - name: violations
        type: Optional<List<agenticspec.cli.SimCheckViolation>>
        summary: Every violation, sorted by rule, subject, part, link and message.
      - name: counts
        type: Optional<Map<String, Integer>>
        summary: The count of violations of every rule of the check, 0 included.

  - name: agenticspec.cli.SimCheckViolation
    kind: struct
    naming:
      summary: One violation of a rule of the architecture check.
    fields:
      - {name: rule, type: String}
      - name: gate
        type: Boolean
        summary: The rule refuses the architecture; false for a rule that only warns.
      - name: subject
        type: String
        summary: The part, or the link as `<from>-><to>:<carries>`.
      - name: part
        type: String
        summary: The part the violation names; for a link, the end at fault.
      - name: link
        type: Optional<Integer>
        summary: The index of the link in `links`, counted from 0, when the subject is a link.
      - {name: message, type: String}

  - name: agenticspec.cli.SimNested
    kind: struct
    naming:
      summary: One nested architecture a check resolved.
    fields:
      - name: part
        type: String
        summary: The part that refers to it, dotted from the outermost document (`console`, `console.vault`).
      - {name: architecture, type: String}
      - name: reference
        type: String
        summary: The `ref` of the part, relative to the document that writes it.
      - name: digest
        type: String
        summary: "`sha256:<hex>`, the pin the referring document writes, which the check found equal."
      - {name: parts, type: Integer}
      - {name: links, type: Integer}

  - name: agenticspec.cli.SimDigestInput
    kind: struct
    fields:
      - name: architecture
        type: String
        summary: An `agenticspec-architecture/1` file.

  - name: agenticspec.cli.SimDigestResult
    kind: struct
    naming:
      summary: >-
        The digest a referring document pins the architecture with: `sha256:` and the SHA-256 of
        the canonical JSON (keys sorted, no whitespace) of its parts, links and border.
    fields:
      - {name: architecture, type: String}
      - {name: digest, type: String}

  - name: agenticspec.cli.SimRunInput
    kind: struct
    fields:
      - name: experiment
        type: String
        summary: An `agenticspec-experiment/1` file; its architecture and profile are read relative to it.
      - name: out
        type: String
        summary: The directory `result.json`, `index.html` and `best.yaml` are written to.
      - name: threads
        type: Optional<Integer>
        summary: Threads of the search; the available parallelism, at most 8, by default.
      - name: events
        type: Boolean
        summary: >-
          Also write `events.jsonl`: the run the result's timeline samples, every moment that is
          a block event written as that event with its part and subject key, one per line.

  - name: agenticspec.cli.SimRunResult
    kind: struct
    naming:
      summary: >-
        One run of an experiment. The KPIs of the baseline and the best variant are printed to
        standard error and written to `result.json`.
    fields:
      - {name: out, type: String}
      - {name: variants, type: Integer}
      - {name: seeds, type: Integer}
      - {name: threads, type: Integer}
      - name: best_written
        type: Boolean
        summary: "`best.yaml`, the best variant as an architecture document, was written."
      - name: events
        type: Optional<Integer>
        summary: The events written to `events.jsonl`; absent without `--events`.

  - name: agenticspec.cli.SimRenderInput
    kind: struct
    fields:
      - name: architecture
        type: String
        summary: An `agenticspec-architecture/1` file.
      - name: result
        type: Optional<String>
        summary: A `result.json` of `sim run`, drawn on the page.
      - name: out
        type: String
        summary: The HTML page to write.

  - name: agenticspec.cli.SimRenderResult
    kind: struct
    fields:
      - {name: out, type: String}

  - name: agenticspec.cli.SimLadderInput
    kind: struct
    fields:
      - name: ladder
        type: String
        summary: The ladder file, `ladder/ladder.yaml`.
      - name: out
        type: String
        summary: The data file of the ladder page.
      - name: check
        type: Boolean
        summary: Compare a fresh generation with the file instead of writing it.

  - name: agenticspec.cli.SimLadderResult
    kind: struct
    fields:
      - {name: out, type: String}
      - {name: rungs, type: Integer}
      - name: written
        type: Boolean
        summary: The file was written; false with `--check`, where it was found current.

  - name: agenticspec.cli.ScenarioAction
    kind: enum
    variants: [check, run]
    naming:
      summary: >-
        check: the scenario against its architecture and profile. run: the scenario on the
        simulator, with its expectations evaluated.

  - name: agenticspec.cli.SimScenarioInput
    kind: struct
    fields:
      - name: action
        type: agenticspec.cli.ScenarioAction
      - name: scenario
        type: String
        summary: An `agenticspec-scenario/1` file; its architecture and profile are read relative to it.
      - name: out
        type: Optional<String>
        summary: The directory `run` writes `scenario-result.json` to.

  - name: agenticspec.cli.SimScenarioResult
    kind: struct
    naming:
      summary: >-
        The scenario checked, with its counts; after `run` also the verdict, the outcome class the
        run predicts and the count of expectations held, failed and not checked.
    fields:
      - {name: scenario, type: String}
      - {name: architecture, type: String}
      - {name: inputs, type: Integer}
      - name: expectations
        type: Integer
        summary: Expected events and KPI bounds.
      - {name: out, type: Optional<String>}
      - {name: verdict, type: Optional<String>}
      - {name: predicted, type: Optional<String>}
      - {name: held, type: Optional<Integer>}
      - {name: failed, type: Optional<Integer>}
      - {name: not_checked, type: Optional<Integer>}

  - name: agenticspec.cli.CorpusAction
    kind: enum
    variants: [run]
    naming:
      summary: "run: every entry of the corpus on the simulator."

  - name: agenticspec.cli.SimCorpusInput
    kind: struct
    fields:
      - name: action
        type: agenticspec.cli.CorpusAction
      - name: corpus
        type: String
        summary: An `agenticspec-corpus/1` file; its scenarios, architecture and profile are read relative to it.

  - name: agenticspec.cli.SimCorpusRow
    kind: struct
    naming:
      summary: One entry of a corpus run, the class it expects beside the class its run predicts.
    fields:
      - {name: entry, type: String}
      - {name: kind, type: String}
      - {name: expected, type: String}
      - {name: predicted, type: String}
      - {name: held, type: Integer}
      - {name: failed, type: Integer}
      - {name: not_checked, type: Integer}
      - {name: verdict, type: String}

  - name: agenticspec.cli.SimCorpusResult
    kind: struct
    naming:
      summary: Every entry of a corpus held. The table of the rows is printed to standard error.
    fields:
      - {name: corpus, type: String}
      - {name: entries, type: Integer}
      - {name: held, type: Integer}
      - {name: failed, type: Integer}
      - {name: rows, type: List<agenticspec.cli.SimCorpusRow>}
  - name: agenticspec.cli.UiPanelsInput
    kind: struct
    fields:
      - name: root
        type: Optional<String>
        summary: The repository root that holds `blocks/` and `ui/views/`; the current directory by default.
      - name: check
        type: Boolean
        summary: Compare a fresh generation with the files instead of writing them.

  - name: agenticspec.cli.UiPanelsResult
    kind: struct
    naming:
      summary: >-
        The block panels: one `ess-ui/1` widget per view of `blocks/` in `ui/views/blocks.ui.yaml`,
        a gallery page per block, a fixture per view and a script per channel under
        `ui/views/fixtures/`, and the digest of the inputs in `ui/views/blocks.sources.sha256`;
        beside them `ui/views/serve.fixtures.json`, the fixtures and scripted outcomes of
        `agenticspec ui serve` in one file with the digest of its sources, which the binary
        embeds.
    fields:
      - {name: out, type: String}
      - {name: panels, type: Integer}
      - {name: files, type: Integer}
      - name: written
        type: Boolean
        summary: The files were written; false with `--check`, where they were found current.

  - name: agenticspec.cli.UiDeriveInput
    kind: struct
    fields:
      - name: path
        type: String
        summary: An architecture document (`agenticspec-architecture/1`); the documents its nested parts reference are read too.
      - name: contract
        type: Optional<String>
        summary: The contract of the architecture (`agenticspec-contract/1`); without it the domains of a part come from the architecture alone and no action is derived.
      - name: ports
        type: Optional<String>
        summary: The port catalogue (`agenticspec-ports/1`); the one built into the binary by default, with `--root` the checkout's `blocks/ports.json` when it exists.
      - name: out
        type: String
        summary: The document to write, `<dir>/<name>.ui.yaml`; its digest, fixtures and layout are written beside it.
      - name: root
        type: Optional<String>
        summary: A checkout of agenticspec whose `blocks/` (compiled with `ess`) and `ui/views/` panels are read instead of the copies built into the binary. Without it the command runs in any directory, and the files read are named relative to the current directory.
      - name: check
        type: Boolean
        summary: Compare a fresh derivation with the files instead of writing them.
      - name: control_plane
        type: Boolean
        summary: >-
          Derive the control-plane UI: beside the overviews and part pages, the pages across parts
          (Inbox, Activity, Operations, Metrics, Architecture, Events) and the overview's tiles,
          selected by port class and the configuration and administration split. Needs the
          contract.
      - name: prediction
        type: Optional<String>
        summary: >-
          A simulator result of the same revision of the architecture
          (`agenticspec-sim-result/1`); with `--control-plane` the Metrics page shows its
          predicted value beside each KPI. A result of another revision is refused.

  - name: agenticspec.cli.UiDeriveResult
    kind: struct
    naming:
      summary: >-
        The operator UI of an architecture: one `ess-ui/1` document (an overview per level, a page
        per part, a channel per level, the actions of the contract) with `<name>.sources.sha256`,
        `<name>.fixtures/` and `<name>.layout.json` beside it; when the contract gives a `ui`
        export to an ingress other than `operator`, one such document per ingress with a `ui`
        export, `<name>.<ingress>.ui.yaml`, each scoped to the ingress's interface, and the counts
        summed over them.
    fields:
      - {name: out, type: String}
      - {name: pages, type: Integer}
      - {name: actions, type: Integer}
      - {name: channels, type: Integer}
      - {name: files, type: Integer}
      - name: written
        type: Boolean
        summary: The files were written; false with `--check`, where they were found current.
      - name: ingresses
        type: Optional<List<agenticspec.cli.UiIngressDerived>>
        summary: The document of each ingress with a `ui` export; absent when the architecture has only the operator UI.

  - name: agenticspec.cli.UiIngressDerived
    kind: struct
    naming:
      summary: The composition of one ingress with a `ui` export.
    fields:
      - {name: ingress, type: String}
      - {name: out, type: String}
      - {name: pages, type: Integer}
      - {name: actions, type: Integer}
      - {name: channels, type: Integer}

  - name: agenticspec.cli.UiBuildInput
    kind: struct
    fields:
      - name: architecture
        type: String
        summary: An architecture document (`agenticspec-architecture/1`); the documents its nested parts reference are read too.
      - name: contract
        type: String
        summary: The contract of the architecture (`agenticspec-contract/1`), derived from the ports this binary carries.
      - name: out
        type: String
        summary: The directory to write; a new or empty one, or one an earlier build wrote, which is replaced.
      - name: api_base
        type: Optional<String>
        summary: The base path or URL of the runtime's adapter the UI reads at, written into `config.json`; `/api/` by default.
      - name: archive
        type: Boolean
        summary: Also write `<out>.tar`, the same files as a tar with sorted entries, mode 0644, owner 0 and time 0, and print its sha256.
      - name: control_plane
        type: Boolean
        summary: >-
          Build the control-plane UI: the operator UI with the pages across parts (Inbox,
          Activity, Operations, Metrics, Architecture, Events) and the overview's tiles;
          `config.json` says `mode: control-plane`.
      - name: prediction
        type: Optional<String>
        summary: >-
          A simulator result of the same revision of the architecture
          (`agenticspec-sim-result/1`); with `--control-plane` the Metrics page shows its
          predicted value beside each KPI. A result of another revision is refused.
      - name: ingress
        type: Optional<String>
        summary: >-
          The ingress whose UI to build, one with a `ui` export; `operator` by default. When the
          contract gives a `ui` export to an ingress other than `operator`, the UI is scoped to
          the ingress's interface and `config.json` names the ingress.

  - name: agenticspec.cli.UiBuildResult
    kind: struct
    naming:
      summary: >-
        The static files of an operator UI: `index.html`, `app.js` and `app.css` of the operator
        app built into the binary, `views.json` (the layout of the derived UI), `contract.json`,
        `ports.json` and `config.json`; the same inputs give the same bytes.
    fields:
      - {name: out, type: String}
      - {name: files, type: Integer}
      - {name: bytes, type: Integer}
      - name: archive
        type: Optional<String>
        summary: The tar written with `--archive`.
      - name: archive_sha256
        type: Optional<String>
        summary: The sha256 of the tar, the digest a deployment bundle carries for it.

  - name: agenticspec.cli.UiServeInput
    kind: struct
    fields:
      - name: architecture
        type: String
        summary: An architecture document (`agenticspec-architecture/1`); the documents its nested parts reference are read too.
      - name: contract
        type: Optional<String>
        summary: The contract of the architecture (`agenticspec-contract/1`); derived from the architecture when absent.
      - name: port
        type: Optional<Integer>
        summary: The local port; 7430 by default, 0 for one the system picks. The server listens on 127.0.0.1 only.
      - name: fixtures
        type: Optional<String>
        summary: >-
          A directory of fixtures to answer from instead of those built into the binary: one
          `<view>.json` per view (`{view, rows}`), the channel scripts in `scripts/`
          (`{channel, events}`) and the scripted outcomes in `outcomes.json`
          (`agenticspec-command-outcomes/1`); the last two may be absent.
      - name: sim
        type: Optional<String>
        summary: >-
          A behaviour profile (`agenticspec-profile/1`) to answer a simulator run from instead of
          fixtures: the architecture simulated once at the values it is built with, seed 1, one
          day. R1 answers each view from the state the run's events left, each row at the scopes
          of the parts its events happened at; R2 replays the run's event log (the lines of
          `sim run --events`) in order, with each event's `seq` as its cursor; the Metrics page
          shows the run's KPIs. Not with `--fixtures`.

  - name: agenticspec.cli.UiServeResult
    kind: struct
    naming:
      summary: >-
        Where the operator UI was served, `http://127.0.0.1:<port>/`, the control-plane UI,
        `<url>control/`, and the root of their runtime interface, `<url>ingress/operator`, and the
        UI of every other ingress with a `ui` export at `<url>ingress/<ingress>/`. The server runs
        until it is stopped.
    fields:
      - {name: url, type: String}
      - {name: control, type: String}
      - {name: interface, type: String}
      - name: ingresses
        type: Optional<List<agenticspec.cli.UiIngressServed>>
        summary: The UI of each ingress with a `ui` export; absent when the architecture has only the operator UI.

  - name: agenticspec.cli.UiIngressServed
    kind: struct
    naming:
      summary: Where the UI of one ingress with a `ui` export is served.
    fields:
      - {name: ingress, type: String}
      - name: url
        type: String
        summary: The app, `<url>ingress/<ingress>/`.
      - name: interface
        type: String
        summary: The root of its runtime interface, `<url>ingress/<ingress>`.

  - name: agenticspec.cli.SimPortsInput
    kind: struct
    fields:
      - name: blocks
        type: Optional<String>
        summary: The directory of the building blocks, an ESS system; `blocks` by default.
      - name: out
        type: Optional<String>
        summary: The ports file to write (`agenticspec-ports/1`); printed when absent.
      - name: check
        type: Optional<String>
        summary: A ports file whose digest is compared with the sources in the blocks directory, without deriving.
      - name: expect
        type: Optional<String>
        summary: An expected list (`agenticspec-ports-expected/1`); one line per difference from the derived ports.

  - name: agenticspec.cli.SimPortsResult
    kind: struct
    naming:
      summary: The derived ports, the digest of their sources, and the differences from an expected list.
    fields:
      - {name: ports, type: Integer}
      - {name: sources_sha256, type: String}
      - name: written
        type: Boolean
        summary: The ports file was written.
      - name: file
        type: Optional<String>
        summary: The ports file as written, when no `--out` was given.
      - name: differences
        type: List<String>
        summary: With `--expect`, one line per difference; the command exits 1 when there is one.

  - name: agenticspec.cli.SimContractInput
    kind: struct
    fields:
      - name: architecture
        type: String
        summary: The architecture document whose contract is derived.
      - name: ports
        type: Optional<String>
        summary: The ports file (`agenticspec-ports/1`); `blocks/ports.json` by default.
      - name: out
        type: Optional<String>
        summary: The contract file to write (`agenticspec-contract/1`), printed when absent; with `--suite`, the cut suite to write.
      - name: check
        type: Optional<String>
        summary: A contract file checked against the document and the ports, without deriving.
      - name: suite
        type: Optional<String>
        summary: A conformance suite of the building blocks (`ess-conformance/<N>`), cut to the scenarios about a command of a port of the contract; `--out` names the cut suite.
      - name: trace
        type: Optional<String>
        summary: A trace (`agenticspec-trace/1`) on which every routing invariant of the contract is checked.
      - name: kpis
        type: Optional<String>
        summary: The KPI catalogue (`agenticspec-kpis/1`) the metrics of an interface are resolved against; `kpis/catalogue.yaml` by default.

  - name: agenticspec.cli.SimContractResult
    kind: struct
    naming:
      summary: The contract of an architecture, its counts, whether it was written, the suite cut to it and the checks of its routing invariants.
    fields:
      - {name: architecture, type: String}
      - {name: ports, type: Integer}
      - {name: invariants, type: Integer}
      - {name: ingresses, type: Integer}
      - name: written
        type: Boolean
        summary: The contract file, or with `--suite` the cut suite, was written.
      - name: contract
        type: Optional<String>
        summary: The contract as written, when none of `--out`, `--check`, `--suite` and `--trace` was given.
      - name: suite_scenarios
        type: Optional<Integer>
        summary: With `--suite`, the scenarios of the whole suite.
      - name: kept_scenarios
        type: Optional<Integer>
        summary: With `--suite`, the scenarios kept, those about a command of a port of the contract.
      - name: checks
        type: List<agenticspec.cli.SimInvariantCheck>
        summary: With `--trace`, the check of each routing invariant, in the contract's order; empty otherwise.

  - name: agenticspec.cli.InvariantStatus
    kind: enum
    variants: [held, violated, not_checked]

  - name: agenticspec.cli.SimInvariantCheck
    kind: struct
    naming:
      summary: >-
        The check of one routing invariant on a trace. An invariant whose predicate names a port the
        trace does not record is not checked, never held.
    fields:
      - {name: link, type: String}
      - {name: predicate, type: String}
      - {name: status, type: agenticspec.cli.InvariantStatus}
      - name: uses
        type: Integer
        summary: The uses of the predicate's ports the check read.
      - name: event
        type: Optional<Integer>
        summary: The index of the event of the first violation.
      - name: detail
        type: Optional<String>
        summary: What was violated, or why the invariant was not checked.

  - name: agenticspec.cli.SimTraceInput
    kind: struct
    fields:
      - name: architecture
        type: String
        summary: The architecture document to simulate, at the values it is built with.
      - name: profile
        type: String
        summary: The behaviour profile (`agenticspec-profile/1`).
      - name: seed
        type: Optional<Integer>
        summary: The seed of the run; 1 by default.
      - name: horizon
        type: Optional<String>
        summary: The simulated time, as a duration (`24h`); one day by default.
      - name: out
        type: Optional<String>
        summary: The trace file to write (`agenticspec-trace/1`); printed when absent.

  - name: agenticspec.cli.SimTraceResult
    kind: struct
    naming:
      summary: The trace of one simulated run, its counts, and whether it was written.
    fields:
      - {name: architecture, type: String}
      - {name: seed, type: Integer}
      - name: uses
        type: Integer
        summary: The port uses the run recorded.
      - name: events
        type: Integer
        summary: The events of the trace, a begin per use and an end per use that ended.
      - name: written
        type: Boolean
        summary: The trace file was written.
      - name: trace
        type: Optional<String>
        summary: The trace as written, when no `--out` was given.

  - name: agenticspec.cli.SimScoreInput
    kind: struct
    fields:
      - name: architecture
        type: Optional<String>
        summary: One architecture document to score, given without `--`.
      - name: profile
        type: String
        summary: The behaviour profile (`agenticspec-profile/1`).
      - name: seed
        type: Optional<Integer>
        summary: >-
          The seed of the run, as an experiment's `seed:`; 0 by default. The KPIs equal those `sim
          run` reports for the baseline of an experiment with this seed and `seeds: 1`.
      - name: horizon
        type: Optional<String>
        summary: The simulated time, as a duration (`24h`); one day by default.
      - name: batch
        type: Boolean
        summary: Answer a list (`results`) also for one document.
      - name: documents
        type: List<String>
        summary: The architecture documents to score, after `--`, in the order they are answered.

  - name: agenticspec.cli.SimScoreResult
    kind: struct
    naming:
      summary: >-
        The KPIs of one architecture document simulated once, or with `--batch` or more than one
        document the answer of each document in their order. A refused document answers
        `{"error": {"code", "message"}}`: alone on standard output with exit 3, in a batch as its
        entry.
    fields:
      - name: kpis
        type: Optional<Json>
        summary: >-
          The KPIs of the run by the ids of `kpis/catalogue.yaml`, a number each: the simulator's,
          the gate counts of the check and the KPIs of the architecture as a whole.
      - name: per_part
        type: Optional<Json>
        summary: The KPIs the simulator reports per part, by part name and KPI id, a number each.
      - name: results
        type: Optional<List<Json>>
        summary: >-
          One entry per document in the order given, each byte for byte the answer of that
          document alone: `{kpis, per_part}` or `{error}`.

  - name: agenticspec.cli.UiGenerateInput
    kind: struct
    fields:
      - name: path
        type: String
        summary: An `ess-ui/1` document, such as `studio/studio.ui.yaml`.
      - name: out
        type: String
        summary: The directory the app is written into; what was in it before is replaced.
      - name: project
        type: Boolean
        summary: >-
          Write a project that builds on its own with node instead: the app under
          `src/generated/`, the kit's sources under `kit/`, a host page, a vite config, an npm
          manifest and lock with the versions the operator UI of `ui build` is built with, and a
          packer; `npm ci && npm run build` in it writes `dist/` and `dist.tar` and prints the
          archive's sha256.

  - name: agenticspec.cli.UiGenerateResult
    kind: struct
    fields:
      - {name: out, type: String}
      - name: files
        type: List<String>
        summary: The files written, by their path below `out`.
  - name: agenticspec.cli.UiConformInput
    kind: struct
    fields:
      - name: source
        type: Optional<String>
        summary: >-
          The root of a runtime's adapter, `http://host:port[/path]`, with the scopes below
          `<root>/scopes/` (`http://127.0.0.1:<port>/ingress/operator` for `agenticspec ui serve`);
          the fixture source of `ui/views/source/` when absent. The bearer token is read from
          `AGENTICSPEC_UI_TOKEN`, else from the plan.
      - name: plan
        type: Optional<String>
        summary: A conformance plan (`agenticspec-runtime-conformance/1`); `ui/views/source/plan.json` below the root by default.
      - name: root
        type: Optional<String>
        summary: >-
          The repository root that holds `ui/views/`; the current directory by default. With
          `--architecture` and no `--source`, the server started here answers from the fixtures
          below it when it is named, and from those built into the binary when it is not.
      - name: architecture
        type: Optional<String>
        summary: >-
          An architecture document (`agenticspec-architecture/1`): check the source against its
          default control plane instead of a plan. Each read of each part answers rows of the
          view's declared shape, a level's channel resumes from a cursor, R4 carries out a command
          R5 allows and refuses one it withholds, and R5 answers at every scope. With no
          `--source`, `agenticspec ui serve` of the architecture is started here and checked.
      - name: contract
        type: Optional<String>
        summary: The contract of the architecture with `--architecture`; derived from it when absent.
      - name: origin
        type: Optional<String>
        summary: >-
          The `Origin` every write (R4) carries, `scheme://host[:port]`; the source's own origin
          by default, what a page served from the source sends.
      - name: header
        type: List<String>
        summary: >-
          A header `'Name: value'` every write carries beside `Origin`, such as the CSRF token of a
          source that accepts only same-origin writes; repeatable.
      - name: json
        type: Boolean
        summary: >-
          Print the report (every check with its status and detail) on standard output, also when
          a check failed; the command still exits non-zero then.

  - name: agenticspec.cli.UiConformCheck
    kind: struct
    fields:
      - {name: name, type: String}
      - name: status
        type: String
        summary: passed, failed or skipped.
      - {name: detail, type: String}

  - name: agenticspec.cli.UiConformResult
    kind: struct
    naming:
      summary: >-
        The checks of the runtime interface (`ui/runtime.openapi.yaml`) against one source: scoped
        reads (R1), the placement views (R3), resuming a channel from a cursor (R2), command
        answers and refusals (R4), the action set (R5) and requests without credentials.
    fields:
      - {name: source, type: String}
      - {name: passed, type: Integer}
      - {name: failed, type: Integer}
      - {name: skipped, type: Integer}
      - {name: checks, type: List<agenticspec.cli.UiConformCheck>}

  - name: agenticspec.cli.BlocksLiftInput
    kind: struct
    fields:
      - name: transcript
        type: String
        summary: The main transcript file of one Claude Code session, `<session>.jsonl`; its sub-agents are read from `<session>/subagents/`.

  - name: agenticspec.cli.EntityRows
    kind: struct
    fields:
      - {name: entity, type: String}
      - {name: rows, type: Integer}

  - name: agenticspec.cli.BlocksLiftResult
    kind: struct
    naming:
      summary: >-
        The rows of one session, in the form of a scenario's `given`, each checked against the
        building blocks, with the count per entity and the entities the session cannot show.
    fields:
      - {name: session_id, type: String}
      - name: given
        type: Json
        summary: "`{ rows: [...] }`: each row `{ entity, id, state, fields, not_recorded, evidence }`."
      - {name: entities, type: List<agenticspec.cli.EntityRows>}
      - name: not_observable
        type: List<String>
        summary: Block entities no record of the session holds; the lift writes no row of them.

  - name: agenticspec.cli.BlocksScenarioInput
    kind: struct
    fields:
      - name: transcript
        type: String
        summary: The main transcript file of one Claude Code session.
      - name: architecture
        type: String
        summary: The architecture file the scenario is written against.
      - name: profile
        type: String
        summary: The behaviour profile file the scenario names.
      - name: map
        type: String
        summary: >-
          The parts the session plays, as `key=part` pairs separated by commas: `main` (required,
          a border part), `sub`, `human` (the part the main part acts for by default), `delegate`
          (the human's part by default) and `peer`.
      - name: out
        type: String
        summary: The scenario file to write; its references are relative to it.
      - name: name
        type: Optional<String>
        summary: The scenario's name; the file name without `.scenario.yaml` by default.

  - name: agenticspec.cli.BlocksScenarioResult
    kind: struct
    naming:
      summary: >-
        The draft scenario written and checked against its architecture and profile, with the
        inputs no turn followed and the inputs whose author plays no part.
    fields:
      - {name: out, type: String}
      - {name: scenario, type: String}
      - {name: inputs, type: Integer}
      - {name: expectations, type: Integer}
      - name: unjoined
        type: List<String>
        summary: Inputs no turn received, as `when.<n> (<node>)`; in the scenario with no expectation.
      - name: unmapped
        type: List<String>
        summary: Inputs whose author plays no part, as `<node> (<author>)`; left out of the scenario.

  - name: agenticspec.cli.PackingDefaultInput
    kind: struct
    fields:
      - name: architecture
        type: String
        summary: The architecture document to pack.
      - name: strategy
        type: Optional<String>
        summary: The strategy to resolve, `single`, `by_kind`, `by_part` or `groups`; `single` by default.

  - name: agenticspec.cli.PackingDefaultResult
    kind: struct
    naming:
      summary: The resolved packing of an architecture under a strategy.
    fields:
      - {name: architecture, type: String}
      - {name: strategy, type: String}
      - name: units
        type: Integer
        summary: The units of the packing, the core among them.
      - name: packing
        type: String
        summary: The `packing:` section in its resolved form, every unit listed.

  - name: agenticspec.cli.DeployBundleInput
    kind: struct
    fields:
      - name: architecture
        type: String
        summary: The architecture document to deploy.
      - name: binding
        type: String
        summary: The binding (`agenticspec-binding/1`) with its packing; its `refines:` chain is resolved.
      - name: out
        type: Optional<String>
        summary: The bundle file to write (`agenticspec-deployment/1`); printed when absent.
      - name: ports
        type: Optional<String>
        summary: The ports file (`agenticspec-ports/1`); `blocks/ports.json` by default.
      - name: accepts
        type: Optional<String>
        summary: The copy of cloudspec's accepted unit kinds and roles; `bundles/cloudspec-accepts.yaml` by default.
      - name: kpis
        type: Optional<String>
        summary: The KPI catalogue (`agenticspec-kpis/1`) the metrics of the default `metrics` ingress are resolved against; `kpis/catalogue.yaml` by default.

  - name: agenticspec.cli.DeployBundleResult
    kind: struct
    naming:
      summary: The bundle of an admitted architecture, its digest and its units.
    fields:
      - {name: architecture, type: String}
      - {name: binding, type: String}
      - name: digest
        type: String
        summary: The bundle digest, `sha256:` and the SHA-256 of the canonical JSON of the bundle without its `digest`.
      - {name: units, type: Integer}
      - name: written
        type: Boolean
        summary: The bundle file was written.
      - name: out
        type: Optional<String>
      - name: bundle
        type: Optional<String>
        summary: The bundle as written, when no `--out` was given.

  - name: agenticspec.cli.DeployCheckInput
    kind: struct
    fields:
      - name: bundle
        type: String
        summary: A written deployment bundle (`agenticspec-deployment/1`) to admit again.
      - name: accepts
        type: Optional<String>
        summary: The copy of cloudspec's accepted unit kinds and roles; `bundles/cloudspec-accepts.yaml` by default.

  - name: agenticspec.cli.DeployCheckResult
    kind: struct
    naming:
      summary: A written bundle admitted again from what it carries, its digest and its units.
    fields:
      - {name: architecture, type: String}
      - {name: binding, type: String}
      - name: digest
        type: String
        summary: The bundle digest, checked against the other members.
      - {name: units, type: Integer}

  - name: agenticspec.cli.IngressDefaultInput
    kind: struct
    fields:
      - name: architecture
        type: String
        summary: The architecture document whose default ingresses are printed.

  - name: agenticspec.cli.IngressDefaultResult
    kind: struct
    naming:
      summary: The default ingresses an architecture has, as the `ingress:` section to paste into it and change.
    fields:
      - {name: architecture, type: String}
      - name: defaults
        type: List<String>
        summary: The names of the default ingresses in effect, those the document neither declares nor sets to `none`.
      - name: ingress
        type: String
        summary: The `ingress:` section of those defaults; pasted unchanged, the document has the same contract.

  - name: agenticspec.cli.IngressProjectInput
    kind: struct
    fields:
      - name: architecture
        type: String
        summary: The architecture document whose exports are projected.
      - name: out
        type: Optional<String>
        summary: The directory the projections are written to.
      - name: check
        type: Optional<String>
        summary: A directory of written projections compared with a fresh projection, writing nothing.
      - name: blocks
        type: Optional<String>
        summary: The directory of the building blocks, an ESS system; `blocks` by default.
      - name: ports
        type: Optional<String>
        summary: The ports file (`agenticspec-ports/1`); `blocks/ports.json` by default.
      - name: kpis
        type: Optional<String>
        summary: The KPI catalogue (`agenticspec-kpis/1`); `kpis/catalogue.yaml` by default.

  - name: agenticspec.cli.IngressProjectResult
    kind: struct
    naming:
      summary: The projections of the exports of an architecture, and whether they were written.
    fields:
      - {name: architecture, type: String}
      - name: exports
        type: Integer
        summary: The exports projected; a ui export has no projection here.
      - name: files
        type: List<String>
        summary: The projection files, per export of an ingress `<ingress>.http.yaml` and `<ingress>.openapi.yaml` (http), `<ingress>.streams.yaml` (event_stream), `<ingress>.cli.yaml` (cli), `<ingress>.tools.yaml` (tool), `<ingress>.agent.yaml` (agent) or `<ingress>.metrics.yaml` (metrics_scrape).
      - name: written
        type: Boolean
        summary: The files were written; false with `--check`, where they were found current.
