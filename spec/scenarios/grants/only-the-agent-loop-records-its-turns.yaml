# Only the agent loop records a model turn and ends its turn. Every other actor is refused both as
# not granted while the agent is working, when the loop itself would be admitted. A synthesized
# suite sends each command as one actor it does not grant, so a mutation that granted either
# command to any other actor survived, or was not witnessed at all.
type: ess-scenario/7
domain: agenticspec.session
scenario: only-the-agent-loop-records-its-turns
summary: While an agent works, every actor but the agent loop is refused a model turn and the end of the turn as not granted; the agent loop then records one and ends the turn.

